<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidewalks of Rage</title>
    <style>
      :root {
        --control-gap: clamp(10px, 2.5vw, 20px);
        --dpad-size: clamp(84px, 18vw, 170px);
        --button-size: clamp(70px, 16vw, 150px);
      }

      body {
        margin: 0;
        background: #0b0b0b;
        overflow: hidden;
      }
      #app {
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--control-gap);
        padding: 16px;
        box-sizing: border-box;
      }
      #left-controls,
      #right-controls {
        flex: 1 1 0;
        display: flex;
        align-items: center;
        pointer-events: auto;
        min-width: 0;
      }
      #left-controls {
        justify-content: flex-start;
      }
      #right-controls {
        justify-content: flex-end;
      }
      #game-container {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container canvas {
        display: block;
      }

      .virtual-dpad {
        position: relative;
        width: var(--dpad-size);
        height: var(--dpad-size);
        border-radius: 16px;
        background: #141414;
        border: 3px solid #f2c94c;
        box-sizing: border-box;
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.08s ease;
      }
      .virtual-dpad::before,
      .virtual-dpad::after {
        content: '';
        position: absolute;
        background: #2a2a2a;
        border: 2px solid #4dd6a6;
        box-sizing: border-box;
      }
      .virtual-dpad::before {
        width: 36%;
        height: 100%;
        left: 32%;
        top: 0;
      }
      .virtual-dpad::after {
        width: 100%;
        height: 36%;
        left: 0;
        top: 32%;
      }
      .virtual-dpad-center {
        position: absolute;
        width: 22%;
        height: 22%;
        left: 39%;
        top: 39%;
        background: #101010;
        border: 2px solid #f2c94c;
        box-sizing: border-box;
      }
      .virtual-dpad.is-pressed {
        transform: scale(0.97);
      }

      .virtual-buttons {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--control-gap);
      }
      .virtual-button {
        width: var(--button-size);
        height: var(--button-size);
        border-radius: 999px;
        background: #1a1a1a;
        color: #f8f8f8;
        border: 3px solid var(--button-border);
        font: 700 13px/1 Verdana, sans-serif;
        letter-spacing: 1px;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.08s ease;
      }
      .virtual-button.attack {
        --button-border: #f25f5c;
        box-shadow: 0 0 0 4px rgba(242, 95, 92, 0.15);
      }
      .virtual-button.jump {
        --button-border: #4dd6a6;
        box-shadow: 0 0 0 4px rgba(77, 214, 166, 0.15);
      }
      .virtual-button.is-pressed {
        transform: scale(0.94);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="left-controls"></div>
      <div id="game-container"></div>
      <div id="right-controls"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
