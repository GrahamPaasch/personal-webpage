                            <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure JS Chess</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
        }
        canvas {
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        #status {
            position: absolute;
            top: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="status">White's Turn</div>
    <canvas id="chessCanvas"></canvas>

<script>
    const canvas = document.getElementById('chessCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');

    // Game Constants
    const BOARD_SIZE = 8;
    let tileSize = 0;
    let selectedSquare = null; // {r, c}
    let turn = 'white';
    let gameOver = false;

    // Piece definitions
    const PIECES = {
        white: { k: '♔', q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' },
        black: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }
    };

    // Initial Board Setup
    let board = [
        ['br', 'bn', 'bb', 'bq', 'bk', 'bb', 'bn', 'br'],
        ['bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp'],
        [null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null],
        ['wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp'],
        ['wr', 'wn', 'wb', 'wq', 'wk', 'wb', 'wn', 'wr'],
    ];

    function init() {
        resize();
        window.addEventListener('resize', resize);
        canvas.addEventListener('mousedown', handleClick);
        draw();
    }

    function resize() {
        const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
        canvas.width = size;
        canvas.height = size;
        tileSize = size / BOARD_SIZE;
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                // Draw Square
                ctx.fillStyle = (r + c) % 2 === 0 ? '#eeeed2' : '#769656';
                
                // Highlight selected square
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    ctx.fillStyle = '#bbc842';
                }
                
                ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);

                // Draw Piece
                const piece = board[r][c];
                if (piece) {
                    const color = piece[0] === 'w' ? 'white' : 'black';
                    const type = piece[1];
                    ctx.fillStyle = 'black'; // Text color (Unicode characters are shapes)
                    ctx.font = `${tileSize * 0.8}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(PIECES[color][type], (c + 0.5) * tileSize, (r + 0.5) * tileSize);
                }
            }
        }
        
        // Highlight possible moves
        if (selectedSquare) {
            const moves = getValidMoves(selectedSquare.r, selectedSquare.c);
            moves.forEach(m => {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.beginPath();
                ctx.arc((m.c + 0.5) * tileSize, (m.r + 0.5) * tileSize, tileSize * 0.15, 0, Math.PI * 2);
                ctx.fill();
            });
        }
    }

    function handleClick(e) {
        if (gameOver) return;

        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const c = Math.floor(x / tileSize);
        const r = Math.floor(y / tileSize);

        if (selectedSquare) {
            const moves = getValidMoves(selectedSquare.r, selectedSquare.c);
            const move = moves.find(m => m.r === r && m.c === c);

            if (move) {
                executeMove(selectedSquare.r, selectedSquare.c, r, c);
                selectedSquare = null;
            } else {
                // Switch selection if clicking another of own pieces, otherwise deselect
                const piece = board[r][c];
                if (piece && piece[0] === (turn === 'white' ? 'w' : 'b')) {
                    selectedSquare = { r, c };
                } else {
                    selectedSquare = null;
                }
            }
        } else {
            const piece = board[r][c];
            if (piece && piece[0] === (turn === 'white' ? 'w' : 'b')) {
                selectedSquare = { r, c };
            }
        }
        draw();
    }

    function executeMove(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        
        // Basic capture logic
        const target = board[toR][toC];
        if (target && target[1] === 'k') {
            statusDiv.innerText = `${turn === 'white' ? 'White' : 'Black'} Wins!`;
            gameOver = true;
        }

        board[toR][toC] = piece;
        board[fromR][fromC] = null;

        // Pawn Promotion (Simple: always promote to Queen)
        if (piece[1] === 'p') {
            if (toR === 0 || toR === 7) {
                board[toR][toC] = (piece[0] === 'w' ? 'wq' : 'bk');
            }
        }

        turn = turn === 'white' ? 'black' : 'white';
        statusDiv.innerText = `${turn.charAt(0).toUpperCase() + turn.slice(1)}'s Turn`;
    }

    function getValidMoves(r, c) {
        const piece = board[r][c];
        if (!piece) return [];

        const color = piece[0];
        const type = piece[1];
        const moves = [];

        const isEnemy = (nr, nc) => {
            if (nr < 0 || nr >= 8 || nc < 0 || nc >= 8) return false;
            return board[nr][nc] !== null && board[nr][nc][0] !== color;
        };
        const isEmpty = (nr, nc) => {
            if (nr < 0 || nr >= 8 || nc < 0 || nc >= 8) return false;
            return board[nr][nc] === null;
        };

        if (type === 'p') {
            const dir = color === 'w' ? -1 : 1;
            // Forward
            if (isEmpty(r + dir, c)) {
                moves.push({ r: r + dir, c });
                // Double move
                if ((color === 'w' && r === 6) || (color === 'b' && r === 1)) {
                    if (isEmpty(r + 2 * dir, c)) moves.push({ r: r + 2 * dir, c });
                }
            }
            // Captures
            if (isEnemy(r + dir, c + 1)) moves.push({ r: r + dir, c: c + 1 });
            if (isEnemy(r + dir, c - 1)) moves.push({ r: r + dir, c: c - 1 });
        } 
        else if (type === 'n') {
            const offsets = [[-2, -1], [-2, 1], [2, -1], [2, 1], [-1, -2], [-1, 2], [1, -2], [1, 2]];
            offsets.forEach(([dr, dc]) => {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && ! (board[nr][nc] && board[nr][nc][0] === color)) {
                    moves.push({ r: nr, c: nc });
                }
            });
        } 
        else if (type === 'b' || type === 'q') {
            const dirs = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
            dirs.forEach(([dr, dc]) => {
                let nr = r + dr, nc = c + dc;
                while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                    if (board[nr][nc] === null) {
                        moves.push({ r: nr, c: nc });
                    } else {
                        if (board[nr][nc][0] !== color) moves.push({ r: nr, c: nc });
                        break;
                    }
                    nr += dr; nc += dc;
                }
            });
        } 
        else if (type === 'r' || type === 'q') {
            const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
            dirs.forEach(([dr, dc]) => {
                let nr = r + dr, nc = c + dc;
                while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                    if (board[nr][nc] === null) {
                        moves.push({ r: nr, c: nc });
                    } else {
                        if (board[nr][nc][0] !== color) moves.push({ r: nr, c: nc });
                        break;
                    }
                    nr += dr; nc += dc;
                }
            });
        } 
        else if (type === 'k') {
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !(board[nr][nc] && board[nr][nc][0] === color)) {
                        moves.push({ r: nr, c: nc });
                    }
                }
            }
        }

        return moves;
    }

    init();
</script>
</body>
</html>
