      function renderHUD(songTime) {
        const acc = currentAccuracy();
        const grade = gradeFromAccuracy(acc);
        const mult = comboMultiplier(game.combo);

        const margin = Math.max(12, width * 0.015);

        // Score
        ctx.fillStyle = PALETTE.pink;
        ctx.globalAlpha = 0.98;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.font = `700 ${Math.max(18, Math.floor(width * 0.024))}px monospace`;
        ctx.fillText(`SCORE ${formatNumber(game.score)}`, margin, margin);

        // Accuracy and grade
        ctx.textAlign = 'right';
        ctx.font = `700 ${Math.max(17, Math.floor(width * 0.021))}px monospace`;
        ctx.fillStyle = PALETTE.magenta;
        ctx.fillText(`ACC ${acc.toFixed(1)}%`, width - margin, margin);
        ctx.fillStyle = PALETTE.violet;
        ctx.fillText(`GRADE ${grade}`, width - margin, margin + 26);

        // Health bar
        const hpW = Math.min(width * 0.28, 250);
        const hpH = 15;
        const hpX = (width - hpW) * 0.5;
        const hpY = margin + 4;

        ctx.globalAlpha = 0.35;
        ctx.fillStyle = PALETTE.indigo;
        drawRoundedRect(ctx, hpX, hpY, hpW, hpH, 8);
        ctx.fill();

        const fill = clamp(game.health / 100, 0, 1);
        const healthGradient = ctx.createLinearGradient(hpX, hpY, hpX + hpW, hpY);
        healthGradient.addColorStop(0, PALETTE.pink);
        healthGradient.addColorStop(0.65, PALETTE.magenta);
        healthGradient.addColorStop(1, PALETTE.red);

        ctx.globalAlpha = 0.92;
        ctx.fillStyle = healthGradient;
        drawRoundedRect(ctx, hpX, hpY, hpW * fill, hpH, 8);
        ctx.fill();

        ctx.globalAlpha = 0.8;
        ctx.strokeStyle = PALETTE.violet;
        ctx.lineWidth = 1;
        drawRoundedRect(ctx, hpX, hpY, hpW, hpH, 8);
        ctx.stroke();

        // Song progress
        const progress = clamp(songTime / (game.totalBeats * BEAT_SEC), 0, 1);
        const pbW = Math.min(width * 0.54, 500);
        const pbH = 8;
        const pbX = (width - pbW) * 0.5;
        const pbY = hpY + hpH + 10;

        ctx.globalAlpha = 0.26;
        ctx.fillStyle = PALETTE.indigo;
        drawRoundedRect(ctx, pbX, pbY, pbW, pbH, 4);
        ctx.fill();

        ctx.globalAlpha = 0.86;
        ctx.fillStyle = PALETTE.violet;
        drawRoundedRect(ctx, pbX, pbY, pbW * progress, pbH, 4);
        ctx.fill();

        // Combo center stack with bounce/shrink reactions.
        const pop = 1 + game.comboPop * 0.2 - game.comboSad * 0.16;
        ctx.save();
        ctx.translate(width * 0.5, height * 0.15);
        ctx.scale(pop, pop);

        if (game.milestoneFlash > 0) {
          ctx.globalAlpha = 0.22 * game.milestoneFlash;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(0, 4, Math.max(22, Math.floor(width * 0.038)), 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = PALETTE.pink;
        ctx.globalAlpha = 0.95;
        ctx.font = `700 ${Math.max(24, Math.floor(width * 0.04))}px monospace`;
        ctx.fillText(`${game.combo}`, 0, 0);

        ctx.font = `700 ${Math.max(14, Math.floor(width * 0.02))}px monospace`;
        ctx.fillStyle = PALETTE.magenta;
        ctx.fillText(`COMBO  x${mult}`, 0, 24);
        ctx.restore();

        // Tutorial hint in first 8 beats.
        if (songTime >= 0 && songTime < TUTORIAL_BEATS * BEAT_SEC) {
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = `700 ${Math.max(15, Math.floor(width * 0.018))}px monospace`;
          ctx.fillStyle = PALETTE.violet;
          ctx.globalAlpha = 0.95;
          ctx.fillText('TUTORIAL: FOLLOW THE BEAT ON D F J K', width * 0.5, layout.laneTop + 16);
        }

        ctx.globalAlpha = 1;
      }

      function renderCountdownOverlay(songTime) {
        if (songTime >= 0 || songTime < -COUNTDOWN_SEC) return;

        const elapsed = songTime + COUNTDOWN_SEC;
        const beatPosition = clamp(elapsed / BEAT_SEC, 0, COUNTDOWN_BEATS - 0.000001);
        const beatIndex = clamp(Math.floor(beatPosition), 0, COUNTDOWN_BEATS - 1);
        const label = COUNTDOWN_LABELS[beatIndex];
        const phaseProgress = beatPosition - beatIndex;

        const pulse = 1 - clamp(phaseProgress, 0, 1);
        const scale = label === 'GO!' ? (0.94 + pulse * 0.32) : (0.9 + pulse * 0.4);
        const alpha = 0.42 + pulse * 0.56;

        const panelW = Math.min(width * 0.92, 760);
        const panelH = Math.max(150, Math.floor(height * 0.24));
        const panelX = (width - panelW) * 0.5;
        const panelY = height * 0.41 - panelH * 0.5;

        ctx.save();
        ctx.globalAlpha = 0.24;
        const panelGradient = ctx.createLinearGradient(panelX, panelY, panelX, panelY + panelH);
        panelGradient.addColorStop(0, 'rgba(10,10,15,0.9)');
        panelGradient.addColorStop(1, 'rgba(40,9,175,0.56)');
        ctx.fillStyle = panelGradient;
        drawRoundedRect(ctx, panelX, panelY, panelW, panelH, 16);
        ctx.fill();

        ctx.globalAlpha = 0.7;
        ctx.strokeStyle = PALETTE.violet;
        ctx.lineWidth = 2;
        drawRoundedRect(ctx, panelX, panelY, panelW, panelH, 16);
        ctx.stroke();

        const centerX = width * 0.5;
        const centerY = panelY + panelH * 0.5;
        const textSize = label === 'GO!'
          ? Math.max(48, Math.floor(width * 0.12))
          : Math.max(64, Math.floor(width * 0.17));

        ctx.translate(centerX, centerY);
        ctx.scale(scale, scale);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.shadowBlur = 34;
        ctx.shadowColor = PALETTE.pink;
        ctx.globalAlpha = alpha * 0.4;
        ctx.fillStyle = '#ffffff';
        ctx.font = `900 ${textSize + 10}px monospace`;
        ctx.fillText(label, 0, -3);

        const textGradient = ctx.createLinearGradient(0, -textSize * 0.65, 0, textSize * 0.65);
        textGradient.addColorStop(0, PALETTE.pink);
        textGradient.addColorStop(0.5, '#ffffff');
        textGradient.addColorStop(1, PALETTE.magenta);
        ctx.fillStyle = textGradient;
        ctx.globalAlpha = alpha;
        ctx.font = `900 ${textSize}px monospace`;
        ctx.fillText(label, 0, -4);

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 0.92;
        ctx.fillStyle = PALETTE.violet;
        ctx.font = `700 ${Math.max(16, Math.floor(width * 0.026))}px monospace`;
        ctx.fillText('GET READY', 0, textSize * 0.72);
        ctx.restore();
      }

        const rows = [
          { id: 'title', weight: 1.2 },
          { id: 'score', weight: 1.45 },
          { id: 'combo', weight: 0.95 },
          { id: 'accuracy', weight: 0.95 },
          { id: 'gradeLabel', weight: 0.72 },
          { id: 'grade', weight: 1.7 },
          { id: 'breakdownTitle', weight: 0.85 },
          { id: 'perfect', weight: 0.82 },
          { id: 'great', weight: 0.82 },
          { id: 'good', weight: 0.82 },
          { id: 'miss', weight: 0.82 }
        ];
        if (high) rows.push({ id: 'best', weight: 0.78 });
        rows.push({ id: 'restart', weight: 0.9 });

        const contentTop = panelY + panelH * 0.09;
        const contentBottom = panelY + panelH * 0.91;
        const contentHeight = contentBottom - contentTop;

        let totalWeight = 0;
        for (let i = 0; i < rows.length; i += 1) {
          totalWeight += rows[i].weight;
        }

        const rowHeights = {};
        const rowY = {};
        const unit = contentHeight / totalWeight;
        let cursorY = contentTop;
        for (let i = 0; i < rows.length; i += 1) {
          const row = rows[i];
          const h = row.weight * unit;
          rowHeights[row.id] = h;
          rowY[row.id] = cursorY + h * 0.5;
          cursorY += h;
        }

        function fontForRow(rowId, scale, minPx, maxPx) {
          return clamp(Math.floor(rowHeights[rowId] * scale), minPx, maxPx);
        }

        const titleSize = fontForRow('title', 0.62, 18, Math.floor(panelW * 0.1));
        const scoreSize = fontForRow('score', 0.72, 24, Math.floor(panelW * 0.13));
        const statSize = fontForRow('combo', 0.58, 12, Math.floor(panelW * 0.06));
        const gradeLabelSize = fontForRow('gradeLabel', 0.6, 11, Math.floor(panelW * 0.05));
        const gradeSize = fontForRow('grade', 0.78, 28, Math.floor(panelW * 0.22));
        const breakdownTitleSize = fontForRow('breakdownTitle', 0.58, 11, Math.floor(panelW * 0.05));
        const breakdownSize = fontForRow('perfect', 0.58, 11, Math.floor(panelW * 0.055));
        const bestSize = high ? fontForRow('best', 0.52, 10, Math.floor(panelW * 0.04)) : 10;
        const restartSize = fontForRow('restart', 0.58, 11, Math.floor(panelW * 0.05));

        const gradeColor = grade.startsWith('S')
          ? PALETTE.pink
          : grade === 'A'
            ? PALETTE.magenta
            : grade === 'B'
              ? PALETTE.violet
              : grade === 'C'
                ? PALETTE.indigo
                : PALETTE.red;

        ctx.fillStyle = game.completed ? PALETTE.pink : PALETTE.red;
        ctx.font = `900 ${titleSize}px monospace`;
        ctx.fillText(game.completed ? 'TRACK COMPLETE' : 'GAME OVER', width * 0.5, rowY.title);

        ctx.fillStyle = PALETTE.magenta;
        ctx.font = `900 ${scoreSize}px monospace`;
        ctx.fillText(`SCORE ${formatNumber(game.score)}`, width * 0.5, rowY.score);

        ctx.fillStyle = PALETTE.violet;
        ctx.font = `700 ${statSize}px monospace`;
        ctx.fillText(`MAX COMBO ${game.maxCombo}`, width * 0.5, rowY.combo);
        ctx.fillText(`ACCURACY ${acc.toFixed(2)}%`, width * 0.5, rowY.accuracy);

        ctx.fillStyle = PALETTE.indigo;
        ctx.font = `700 ${gradeLabelSize}px monospace`;
        ctx.fillText('GRADE', width * 0.5, rowY.gradeLabel);

        ctx.fillStyle = gradeColor;
        ctx.font = `900 ${gradeSize}px monospace`;
        ctx.fillText(grade, width * 0.5, rowY.grade);

        ctx.fillStyle = PALETTE.pink;
        ctx.font = `700 ${breakdownTitleSize}px monospace`;
        ctx.fillText('BREAKDOWN', width * 0.5, rowY.breakdownTitle);

        ctx.fillStyle = PALETTE.magenta;
        ctx.font = `700 ${breakdownSize}px monospace`;
        ctx.fillText(`PERFECT ${game.judgments.perfect}`, width * 0.5, rowY.perfect);
        ctx.fillText(`GREAT ${game.judgments.great}`, width * 0.5, rowY.great);
        ctx.fillText(`GOOD ${game.judgments.good}`, width * 0.5, rowY.good);
        ctx.fillText(`MISS ${game.judgments.miss}`, width * 0.5, rowY.miss);

        if (high && rowY.best !== undefined) {
          ctx.fillStyle = PALETTE.violet;
          ctx.font = `600 ${bestSize}px monospace`;
          ctx.fillText(
            `BEST ${selectedName.toUpperCase()} ${formatNumber(high.score)}  |  ${high.accuracy.toFixed(1)}%  |  ${high.grade}`,
            width * 0.5,
            rowY.best
          );
        }

        ctx.fillStyle = PALETTE.pink;
        ctx.font = `700 ${restartSize}px monospace`;
        ctx.fillText('PRESS SPACE TO RESTART', width * 0.5, rowY.restart);
      }

      // =========================
      // Main Render
      // =========================
      function render() {
        const alpha = clamp(runtime.accumulator / FIXED_STEP_SEC, 0, 1);
        const songTime = lerp(runtime.songTimePrev, runtime.songTimeCurr, alpha);

        ctx.save();

        // Miss shake
        if (game.screenShake.life > 0 && game.screenShake.amplitude > 0.01) {
          const shakeNorm = clamp(game.screenShake.life / game.screenShake.maxLife, 0, 1);
          const shake = game.screenShake.amplitude * shakeNorm;
          const sx = (Math.random() - 0.5) * shake;
          const sy = (Math.random() - 0.5) * shake;
          ctx.translate(sx, sy);
        }

        renderBackground(songTime);

        if (game.screen === 'playing' || game.screen === 'gameover') {
          renderLanes(songTime);
          renderParticlesAndPopups();
          if (game.screen === 'playing') {
            renderRhythmStudyBanner();
          }
          renderHUD(songTime);
          if (game.screen === 'playing') {
            renderCountdownOverlay(songTime);
          }
        }

        if (game.screen === 'start') {
          renderStartScreen();
        } else if (game.screen === 'gameover') {
          renderGameOverScreen();
        }

        // Miss vignette flash
        if (game.missFlash > 0) {
          const vignetteAlpha = clamp(game.missFlash * 0.28, 0, 0.28);
          const grad = ctx.createRadialGradient(width * 0.5, height * 0.5, Math.min(width, height) * 0.22, width * 0.5, height * 0.5, Math.max(width, height) * 0.7);
          grad.addColorStop(0, 'rgba(0,0,0,0)');
          grad.addColorStop(1, `rgba(197,15,73,${vignetteAlpha.toFixed(3)})`);
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, width, height);
        }

        ctx.restore();

        if (game.frameFlash > 0) {
          ctx.globalAlpha = clamp(game.frameFlash, 0, 0.12);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, height);
          ctx.globalAlpha = 1;
          game.frameFlash = 0;
        }
      }

      // =========================
      // Main Loop
      // =========================
      function frame(now) {
        const dt = clamp((now - runtime.lastFrame) / 1000, 0, 0.25);
        runtime.lastFrame = now;
        runtime.accumulator += dt;

        let steps = 0;
        while (runtime.accumulator >= FIXED_STEP_SEC && steps < MAX_SIM_STEPS) {
          runtime.elapsedSec += FIXED_STEP_SEC;
          update(FIXED_STEP_SEC);
          runtime.accumulator -= FIXED_STEP_SEC;
          steps += 1;
        }

        if (steps >= MAX_SIM_STEPS) {
          runtime.accumulator = 0;
        }

        render();

        window.requestAnimationFrame(frame);
      }

      // =========================
      // Boot
      // =========================
      function init() {
        game.highScores = loadHighScores();
        initObjectPools();
        clearTransientEffects();
        if (RHYTHM_FAMILIES.length > 0) {
          game.selectedRhythmFamily = RHYTHM_FAMILIES[0];
        }
        syncRhythmSelectionBounds();
        resize();

        window.addEventListener('resize', resize);
        window.addEventListener('keydown', handleKeyDown, { passive: false });
        window.addEventListener('keyup', handleKeyUp, { passive: true });
        window.addEventListener('blur', () => {
          game.lanePressedKeyboard = [false, false, false, false];
        });

        canvas.addEventListener('pointerdown', handlePointerDown, { passive: false });
        canvas.addEventListener('pointermove', handlePointerMove, { passive: true });
        canvas.addEventListener('pointerup', handlePointerUp, { passive: true });
        canvas.addEventListener('pointercancel', handlePointerUp, { passive: true });

        window.requestAnimationFrame(frame);
      }

      init();
    })();
  </script>
</body>
</html>
