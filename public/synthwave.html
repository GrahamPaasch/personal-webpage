      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function easeOutCubic(t) {
        const p = clamp(t, 0, 1);
        const q = 1 - p;
        return 1 - (q * q * q);
      }

      function hash01(n) {
        const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
        return x - Math.floor(x);
      }

      function createSeededRng(seed) {
        let state = (seed >>> 0) || 1;
        return () => {
          state = (state + 0x6D2B79F5) >>> 0;
          let t = state;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function mixSeedWithText(seed, text) {
        let mixed = (seed >>> 0) || 1;
        for (let i = 0; i < text.length; i += 1) {
          mixed ^= text.charCodeAt(i);
          mixed = Math.imul(mixed, 16777619) >>> 0;
        }
        return mixed >>> 0;
      }

      function randomInt(rng, min, max) {
        return min + Math.floor(rng() * ((max - min) + 1));
      }

      function shuffleInPlace(array, rng) {
        for (let i = array.length - 1; i > 0; i -= 1) {
          const j = randomInt(rng, 0, i);
          const tmp = array[i];
          array[i] = array[j];
          array[j] = tmp;
        }
      }

      function densityCurveAtProgress(progress) {
        const p = clamp(progress, 0, 1);
        if (p < 0.18) return lerp(0.35, 0.58, p / 0.18);
        if (p < 0.72) return lerp(0.58, 1.0, (p - 0.18) / 0.54);
        if (p < 0.9) return lerp(1.0, 0.82, (p - 0.72) / 0.18);
        return lerp(0.82, 0.68, (p - 0.9) / 0.1);
      }

      function rhythmFamilyFromOrigin(origin) {
        if (!origin || typeof origin !== 'string') return 'Other';
        const leftSide = origin.split('/')[0].trim();
        const compact = leftSide.replace(/\s*\([^)]*\)\s*$/, '').trim();
        if (compact) return compact;
        return origin.trim() || 'Other';

          if (!seen.has(family)) {

        if (!game.selectedRhythmFamily || !RHYTHM_FAMILIES.includes(game.selectedRhythmFamily)) {

        game.selectedRhythmDifficultyFilter = clamp(game.selectedRhythmDifficultyFilter | 0, 0, 5);
        const rhythms = getRhythmsForSelection();
        if (!rhythms.length) {

        game.selectedRhythmIndex = clamp(game.selectedRhythmIndex | 0, 0, rhythms.length - 1);

        const next = (start + direction + RHYTHM_FAMILIES.length) % RHYTHM_FAMILIES.length;
        game.selectedRhythmFamily = RHYTHM_FAMILIES[next];
        game.selectedRhythmIndex = 0;

        const safeText = String(text || '');
        if (maxWidth <= 0) return '';
        if (ctx.measureText(safeText).width <= maxWidth) return safeText;
        const ellipsis = '...';
        let out = safeText;
        while (out.length > 0 && ctx.measureText(out + ellipsis).width > maxWidth) {
          out = out.slice(0, -1);
        }
        return out + ellipsis;

          const particle = pool[idx];
          if (!particle.active) {
            particle.active = true;
            game.particlePoolCursor = (idx + 1) % pool.length;
            game.particles.push(particle);
            return particle;
          }
        }

        if (game.particles.length > 0) {
          const recycled = game.particles.shift();
          if (recycled) {
            recycled.active = true;
            game.particles.push(recycled);

        return null;

      function drawRoundedRect(g, x, y, w, h, r) {
        const rr = Math.min(r, w * 0.5, h * 0.5);
        g.beginPath();
        g.moveTo(x + rr, y);
        g.lineTo(x + w - rr, y);
        g.quadraticCurveTo(x + w, y, x + w, y + rr);
        g.lineTo(x + w, y + h - rr);
        g.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
        g.lineTo(x + rr, y + h);
        g.quadraticCurveTo(x, y + h, x, y + h - rr);
        g.lineTo(x, y + rr);
        g.quadraticCurveTo(x, y, x + rr, y);
        g.closePath();
      }

      function noteNameToFrequency(note) {
        if (!note) return 0;
        const match = /^([A-G])([#b]?)(-?\d)$/.exec(note);
        if (!match) return 0;

        const letter = match[1];
        const accidental = match[2];
        const octave = Number(match[3]);
        const semitoneMap = {
          C: 0,
          D: 2,
          E: 4,
          F: 5,
          G: 7,
          A: 9,
          B: 11
        };

        let semitone = semitoneMap[letter];
        if (accidental === '#') semitone += 1;
        if (accidental === 'b') semitone -= 1;

        const midi = (octave + 1) * 12 + semitone;
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

        const totalNotes = game.chart.length;

          (game.judgments.great * BASE_POINTS.great) +
          (game.judgments.good * BASE_POINTS.good);
        const possible = totalNotes * BASE_POINTS.perfect;
        return clamp((earned / possible) * 100, 0, 100);

          return {

            Hard: parsed.Hard || fallback.Hard

        arpBus: null,
        padBus: null,
        synthDucker: null,
        melodyDelay: null,
        melodyFeedback: null,
        noiseBuffer: null,
        active: false,
        nextStepTime: 0,
        nextStepIndex: 0,
        maxSteps: TOTAL_STEPS,
        audioReady: false,
        arpPattern: [0, 1, 2, 1, 3, 2, 1, 0],
        arpIndex: 0,
        lastHitLane: 0,
        sidechainDepth: 0.4,
        sidechainDuckSec: 0.05,
        sidechainRecoverSec: 0.1
      };

      function lanePitchHz(lane) {
        const safeLane = clamp((lane | 0), 0, LANE_PITCH_HZ.length - 1);
        return LANE_PITCH_HZ[safeLane] || LANE_PITCH_HZ[0];
      }

      function buildArpPatternFromChart(chartNotes) {
        const counts = [0, 0, 0, 0];
        for (let i = 0; i < chartNotes.length; i += 1) {
          const lane = chartNotes[i].lane;
          if (lane >= 0 && lane < 4) {
            counts[lane] += 1;
          }
        }

        const order = [0, 1, 2, 3].sort((a, b) => {
          if (counts[b] !== counts[a]) return counts[b] - counts[a];
          return a - b;
        });

        return [
          order[0],
          order[1],
          order[2],
          order[1],
          order[3],
          order[2],
          order[1],
          order[0]
        ];
      }

      function createNoiseBuffer(context) {
        const durationSec = 1;
        const buffer = context.createBuffer(1, Math.floor(context.sampleRate * durationSec), context.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i += 1) {
          data[i] = (Math.random() * 2) - 1;
        }
        return buffer;
      }

      async function ensureAudioContext() {
        if (!audio.ctx) {
          const AudioCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtor) {
            throw new Error('Web Audio API unavailable');
          }

          audio.ctx = new AudioCtor();

          audio.masterGain = audio.ctx.createGain();
          audio.musicGain = audio.ctx.createGain();
          audio.drumBus = audio.ctx.createGain();
          audio.bassBus = audio.ctx.createGain();
          audio.melodyBus = audio.ctx.createGain();
          audio.arpBus = audio.ctx.createGain();
          audio.padBus = audio.ctx.createGain();
          audio.synthDucker = audio.ctx.createGain();
          audio.melodyDelay = audio.ctx.createDelay(0.5);
          audio.melodyFeedback = audio.ctx.createGain();

          audio.masterGain.gain.value = 0.9;
          audio.musicGain.gain.value = 0.0001;
          audio.drumBus.gain.value = 0.92;
          audio.bassBus.gain.value = 0.64;
          audio.melodyBus.gain.value = 0.58;
          audio.arpBus.gain.value = 0.23;
          audio.padBus.gain.value = 0.14;
          audio.synthDucker.gain.value = 1.0;
          audio.melodyDelay.delayTime.value = 0.17;
          audio.melodyFeedback.gain.value = 0.24;

          audio.drumBus.connect(audio.musicGain);
          audio.bassBus.connect(audio.musicGain);
          audio.melodyBus.connect(audio.synthDucker);
          audio.arpBus.connect(audio.synthDucker);
          audio.padBus.connect(audio.synthDucker);

          audio.melodyBus.connect(audio.melodyDelay);
          audio.melodyDelay.connect(audio.melodyFeedback);
          audio.melodyFeedback.connect(audio.melodyDelay);
          audio.melodyDelay.connect(audio.synthDucker);

          audio.synthDucker.connect(audio.musicGain);

          audio.musicGain.connect(audio.masterGain);
          audio.masterGain.connect(audio.ctx.destination);

          audio.noiseBuffer = createNoiseBuffer(audio.ctx);
        }

        if (audio.ctx.state !== 'running') {
          await audio.ctx.resume();
        }
        audio.audioReady = true;
      }

      function primeAudioFromGesture() {
        if (audio.ctx && audio.ctx.state === 'running') return;
        ensureAudioContext().catch(() => {});
      }

      function triggerSidechainPump(time) {
        if (!audio.ctx || !audio.synthDucker) return;
        const gain = audio.synthDucker.gain;
        const duckTo = 1 - audio.sidechainDepth;
        const duckEnd = time + audio.sidechainDuckSec;
        const recoverEnd = duckEnd + audio.sidechainRecoverSec;
        gain.cancelScheduledValues(time);
        gain.setValueAtTime(Math.max(0.0001, gain.value), time);
        gain.linearRampToValueAtTime(duckTo, duckEnd);
        gain.linearRampToValueAtTime(1.0, recoverEnd);
      }

      function scheduleKick(time) {
        const context = audio.ctx;
        if (!context) return;

        const osc = context.createOscillator();
        const gain = context.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(155, time);
        osc.frequency.exponentialRampToValueAtTime(52, time + 0.14);

        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(1.1, time + 0.003);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);

        osc.connect(gain);
        gain.connect(audio.drumBus);

        osc.start(time);
        osc.stop(time + 0.18);

        triggerSidechainPump(time);
      }

      function scheduleSnare(time) {
        const context = audio.ctx;
        if (!context || !audio.noiseBuffer) return;

        const noise = context.createBufferSource();
        noise.buffer = audio.noiseBuffer;

        const noiseFilter = context.createBiquadFilter();
        noiseFilter.type = 'highpass';
        noiseFilter.frequency.setValueAtTime(1800, time);

        const noiseGain = context.createGain();
        noiseGain.gain.setValueAtTime(0.0001, time);
        noiseGain.gain.exponentialRampToValueAtTime(0.85, time + 0.002);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.2);

        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audio.drumBus);

        const tone = context.createOscillator();
        const toneGain = context.createGain();
        tone.type = 'triangle';
        tone.frequency.setValueAtTime(180, time);
        toneGain.gain.setValueAtTime(0.0001, time);
        toneGain.gain.exponentialRampToValueAtTime(0.35, time + 0.002);
        toneGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.12);

        tone.connect(toneGain);
        toneGain.connect(audio.drumBus);

        noise.start(time);
        noise.stop(time + 0.21);
        tone.start(time);
        tone.stop(time + 0.13);
      }

      function scheduleHiHat(time, accent = false) {
        const context = audio.ctx;
        if (!context || !audio.noiseBuffer) return;

        const noise = context.createBufferSource();
        noise.buffer = audio.noiseBuffer;

        const hp = context.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.setValueAtTime(5500, time);

        const bp = context.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.setValueAtTime(accent ? 9400 : 8800, time);
        bp.Q.setValueAtTime(0.6, time);

        const gain = context.createGain();
        const length = accent ? 0.052 : 0.04;
        const amp = accent ? 0.2 : 0.13;
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(amp, time + 0.001);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + length);

        noise.connect(hp);
        hp.connect(bp);
        bp.connect(gain);
        gain.connect(audio.drumBus);

        noise.start(time);
        noise.stop(time + length + 0.015);
      }

      function scheduleOpenHiHat(time, accent = false) {
        const context = audio.ctx;
        if (!context || !audio.noiseBuffer) return;

        const noise = context.createBufferSource();
        noise.buffer = audio.noiseBuffer;

        const hp = context.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.setValueAtTime(4200, time);

        const bp = context.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.setValueAtTime(accent ? 7600 : 7000, time);
        bp.Q.setValueAtTime(0.55, time);

        const gain = context.createGain();
        const length = accent ? 0.15 : 0.12;
        const amp = accent ? 0.17 : 0.135;
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(amp, time + 0.003);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + length);

        noise.connect(hp);
        hp.connect(bp);
        bp.connect(gain);
        gain.connect(audio.drumBus);

        noise.start(time);
        noise.stop(time + length + 0.02);
      }

      function scheduleSubBass(time, frequency, durationSec) {
        const context = audio.ctx;
        if (!context || frequency <= 0) return;

        const saw = context.createOscillator();
        const sub = context.createOscillator();
        const filter = context.createBiquadFilter();
        const gain = context.createGain();

        saw.type = 'sawtooth';
        saw.frequency.setValueAtTime(frequency, time);
        sub.type = 'triangle';
        sub.frequency.setValueAtTime(frequency * 0.5, time);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(190, time);
        filter.Q.setValueAtTime(0.9, time);

        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(0.62, time + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + durationSec);

        saw.connect(filter);
        sub.connect(filter);
        filter.connect(gain);
        gain.connect(audio.bassBus);

        saw.start(time);
        sub.start(time);
        saw.stop(time + durationSec + 0.05);
        sub.stop(time + durationSec + 0.05);
      }

      function scheduleChartLead(time, frequency, options = {}) {
        const context = audio.ctx;
        if (!context || frequency <= 0) return;

        const volume = Math.max(0.0002, options.volume || 0.22);
        const sustain = Math.max(0.05, options.sustain || 0.22);
        const cutoff = Math.max(140, options.cutoff || 2200);
        const q = options.q || 1.2;
        const dual = Boolean(options.dual);
        const detuneSpread = options.detuneSpread || 8;
        const waveform = options.waveform || 'sawtooth';

        const filter = context.createBiquadFilter();
        const gain = context.createGain();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(cutoff * 0.72, time);
        filter.frequency.linearRampToValueAtTime(cutoff, time + 0.05);
        filter.Q.setValueAtTime(q, time);

        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(volume, time + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + sustain);

        const oscA = context.createOscillator();
        oscA.type = waveform;
        oscA.frequency.setValueAtTime(frequency, time);
        oscA.detune.setValueAtTime(dual ? -detuneSpread * 0.5 : 0, time);
        oscA.connect(filter);

        let oscB = null;
        if (dual) {
          oscB = context.createOscillator();
          oscB.type = waveform;
          oscB.frequency.setValueAtTime(frequency, time);
          oscB.detune.setValueAtTime(detuneSpread * 0.5, time);
          oscB.connect(filter);
        }

        filter.connect(gain);
        gain.connect(audio.melodyBus);

        oscA.start(time);
        oscA.stop(time + sustain + 0.04);
        if (oscB) {
          oscB.start(time);
          oscB.stop(time + sustain + 0.04);
        }
      }

      function scheduleArp(time, frequency, durationSec = 0.15) {
        const context = audio.ctx;
        if (!context || frequency <= 0) return;

        const osc = context.createOscillator();
        const filter = context.createBiquadFilter();
        const gain = context.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(frequency, time);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1500, time);
        filter.Q.setValueAtTime(1.6, time);

        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(0.075, time + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + durationSec);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audio.arpBus);

        osc.start(time);
        osc.stop(time + durationSec + 0.03);
      }

      function schedulePadChord(time, chordNotes, durationSec) {
        const context = audio.ctx;
        if (!context || !Array.isArray(chordNotes) || chordNotes.length <= 0) return;

        const filter = context.createBiquadFilter();
        const gain = context.createGain();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1050, time);
        filter.frequency.linearRampToValueAtTime(1320, time + 0.65);
        filter.Q.setValueAtTime(0.7, time);

        const attack = 0.4;
        const releaseStart = Math.max(time + attack + 0.2, time + durationSec - 0.45);
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.linearRampToValueAtTime(0.34, time + attack);
        gain.gain.setValueAtTime(0.34, releaseStart);
        gain.gain.linearRampToValueAtTime(0.0001, time + durationSec);

        filter.connect(gain);
        gain.connect(audio.padBus);

        for (let i = 0; i < chordNotes.length; i += 1) {
          const frequency = noteNameToFrequency(chordNotes[i]);
          if (frequency <= 0) continue;
          const osc = context.createOscillator();
          osc.type = i % 2 === 0 ? 'triangle' : 'sawtooth';
          osc.frequency.setValueAtTime(frequency, time);
          osc.detune.setValueAtTime(i * 3 - 3, time);
          osc.connect(filter);
          osc.start(time);
          osc.stop(time + durationSec + 0.05);
        }
      }

      function triggerChartMelody(note, quality) {
        if (!audio.ctx || !audio.audioReady || !note) return;

        const lane = clamp((note.lane | 0), 0, LANE_PITCH_HZ.length - 1);
        const frequency = lanePitchHz(lane);
        const now = audio.ctx.currentTime;
        let when = now + 0.003;

        if (game.usingAudioClock && Number.isFinite(game.songStartAudioTime) && Number.isFinite(note.time)) {
          when = Math.max(when, game.songStartAudioTime + note.time);
        }

        if (quality === 'miss') {
          scheduleChartLead(when, frequency, {
            volume: 0.028,
            sustain: 0.11,
            cutoff: 410,
            q: 0.5,
            dual: false,
            waveform: 'triangle'
          });
          return;
        }

        audio.lastHitLane = lane;

        if (quality === 'perfect') {
          scheduleChartLead(when, frequency, {
            volume: 0.34,
            sustain: 0.38,
            cutoff: 3200,
            q: 2.0,
            dual: true,
            detuneSpread: 12,
            waveform: 'sawtooth'
          });
          return;
        }

        if (quality === 'great') {
          scheduleChartLead(when, frequency, {
            volume: 0.26,
            sustain: 0.27,
            cutoff: 2600,
            q: 1.5,
            dual: false,
            waveform: 'sawtooth'
          });
          return;
        }

        scheduleChartLead(when, frequency, {
          volume: 0.18,
          sustain: 0.18,
          cutoff: 2100,
          q: 1.1,
          dual: false,
          waveform: 'sawtooth'
        });
      }

      function scheduleCountdownBar(startTimeSec) {
        if (!audio.ctx || !audio.audioReady) return;

        for (let i = 0; i < COUNTDOWN_BEATS; i += 1) {
          const when = startTimeSec + i * BEAT_SEC;
          if (i === 0 || i === 2) {
            scheduleKick(when);
          } else {
            scheduleSnare(when);
          }
        }
      }

      function startScheduledAudio(startTimeSec, totalSteps) {
        if (!audio.ctx || !audio.audioReady) {
          return;
        }
        audio.active = true;
        audio.nextStepTime = startTimeSec;
        audio.nextStepIndex = 0;
        audio.maxSteps = totalSteps;
        audio.lastHitLane = 0;
        audio.arpPattern = buildArpPatternFromChart(game.chart);
        audio.arpIndex = 0;

        const now = audio.ctx.currentTime;
        const preStartHoldTime = Math.max(now + 0.12, startTimeSec - 0.02);
        audio.musicGain.gain.cancelScheduledValues(now);
        audio.musicGain.gain.setValueAtTime(0.0001, now);
        audio.musicGain.gain.linearRampToValueAtTime(0.65, Math.min(startTimeSec, now + 0.12));
        audio.musicGain.gain.setValueAtTime(0.65, preStartHoldTime);
        audio.musicGain.gain.linearRampToValueAtTime(0.75, startTimeSec + 0.1);
        if (audio.synthDucker) {
          audio.synthDucker.gain.cancelScheduledValues(now);
          audio.synthDucker.gain.setValueAtTime(1.0, now);
        }
      }

      function stopScheduledAudio() {
        if (!audio.ctx || !audio.audioReady) return;

        audio.active = false;
        const now = audio.ctx.currentTime;
        audio.musicGain.gain.cancelScheduledValues(now);
        audio.musicGain.gain.setValueAtTime(audio.musicGain.gain.value, now);
        audio.musicGain.gain.linearRampToValueAtTime(0.0001, now + 0.15);
        if (audio.synthDucker) {
          audio.synthDucker.gain.cancelScheduledValues(now);
          audio.synthDucker.gain.setValueAtTime(audio.synthDucker.gain.value, now);
          audio.synthDucker.gain.linearRampToValueAtTime(1.0, now + 0.15);
        }
      }

      function scheduleAudioStep(stepIndex, when) {
        if (stepIndex >= game.totalSteps) {
          return;
        }

        const beatStep = stepIndex % 4;
        const beatIndex = Math.floor(stepIndex / 4);
        const beatInBar = beatIndex % 4;

        if (beatStep === 0) {
          if (beatInBar === 0 || beatInBar === 2) {
            scheduleKick(when);
          } else {
            scheduleSnare(when);
          }
        }

        if (stepIndex % 2 === 0) {
          const openHatSlot = beatStep === 2 && (beatInBar === 1 || beatInBar === 3);
          const useOpenHat = openHatSlot && hash01(stepIndex * 2.11 + game.chartSeed * 0.0001) > 0.64;
          if (useOpenHat) {
            scheduleOpenHiHat(when, false);
          } else {
            scheduleHiHat(when, stepIndex % 4 === 0);
          }
        }

        if (stepIndex % 8 === 0) {
          const rootFrequency = lanePitchHz(audio.lastHitLane) * 0.5;
          scheduleSubBass(when, rootFrequency, BEAT_SEC * 0.92);
        }

        if (stepIndex % 64 === 0) {
          const progressionIndex = Math.floor(stepIndex / 64) % PAD_CHORD_PROGRESSION.length;
          const chord = PAD_CHORD_PROGRESSION[progressionIndex];
          schedulePadChord(when, chord, BEAT_SEC * 15.8);
        }

        if (stepIndex % 4 === 2 && audio.arpPattern.length > 0) {
          const lane = audio.arpPattern[audio.arpIndex % audio.arpPattern.length];
          audio.arpIndex += 1;
          scheduleArp(when, lanePitchHz(lane) * 2, STEP_SEC * 1.35);
        }
      }

      function scheduleAudioAhead() {
        if (!audio.active || !audio.ctx) return;

        const lookAhead = 0.18;
        while (audio.nextStepTime < audio.ctx.currentTime + lookAhead) {
          scheduleAudioStep(audio.nextStepIndex, audio.nextStepTime);
          audio.nextStepIndex += 1;
          audio.nextStepTime += STEP_SEC;

          if (audio.nextStepIndex > audio.maxSteps + 24) {
            audio.active = false;
            break;
          }
        }
      }

      // =========================
      // Chart Generation
      // =========================
      function resetChartContainer() {
        game.chart = [];
        game.chartKeySet = new Set();
      }

      function addChartNote(timeSec, lane, stepIndex = Math.round(timeSec / STEP_SEC)) {
        const rounded = timeSec.toFixed(5);
        const key = `${rounded}:${lane}`;
        if (game.chartKeySet.has(key)) return;
        game.chartKeySet.add(key);
        game.chart.push({
          time: timeSec,
          step: stepIndex,
          lane,
          judged: false,
          hit: false,
          miss: false
        });
      }

      function getMusicalLaneHints(stepInBar, patternIndex) {
        const hints = [];
        if (stepInBar % 4 === 0) hints.push(0);
        if (stepInBar % 8 === 4) hints.push(1);

        if (stepInBar % 2 === 0) {
          const eighthIndex = Math.floor(stepInBar / 2);
          const bassNote = BASS_PATTERN_BARS[patternIndex][eighthIndex];
          const leadNote = LEAD_PATTERN_BARS[patternIndex][eighthIndex];
          if (bassNote) hints.push(stepInBar % 4 === 0 ? 0 : 2);
          if (leadNote) hints.push(noteNameToFrequency(leadNote) >= 500 ? 3 : 2);
        }

        if (stepInBar % 4 === 2) hints.push(3);
        return Array.from(new Set(hints.filter((lane) => lane >= 0 && lane < 4)));
      }

      function weightedPick(rng, values, weightForValue) {
        if (!values || values.length <= 0) return null;
        let totalWeight = 0;
        const weights = [];
        for (let i = 0; i < values.length; i += 1) {
          const weight = Math.max(0, weightForValue(values[i], i));
          weights.push(weight);
          totalWeight += weight;
        }

        if (totalWeight <= 0) {
          return values[randomInt(rng, 0, values.length - 1)];
        }

        let roll = rng() * totalWeight;
        for (let i = 0; i < values.length; i += 1) {
          roll -= weights[i];
          if (roll <= 0) return values[i];
        }
        return values[values.length - 1];
      }

      function targetNotesForBar(difficultyId, density, rng, isIntro) {
        if (difficultyId === 'easy') {
          const target = (isIntro ? 1.5 : 1.8) + density * 1.0 + (rng() - 0.5) * 0.45;
          return clamp(Math.round(target), 1, 4);
        }

        if (difficultyId === 'normal') {
          const target = (isIntro ? 2.5 : 2.8) + density * 1.35 + (rng() - 0.5) * 0.55;
          return clamp(Math.round(target), isIntro ? 2 : 3, 4);
        }

        const target = (isIntro ? 4.4 : 4.9) + density * 1.95 + (rng() - 0.5) * 0.9;
        return clamp(Math.round(target), isIntro ? 4 : 5, 7);
      }

      function chooseEasyBarEvents(rng, targetNotes, isIntro) {
        const stepPool = isIntro ? [0, 8] : [0, 4, 8, 12];
        const stepSet = new Set();
        while (stepSet.size < Math.min(targetNotes, stepPool.length)) {
          stepSet.add(weightedPick(rng, stepPool, (step) => (step % 8 === 0 ? 1.25 : 1)));
        }
        return Array.from(stepSet).sort((a, b) => a - b).map((step) => ({ step, chord: false }));
      }

      function chooseNormalBarEvents(rng, targetNotes, density, isIntro) {
        const stepPool = isIntro ? [0, 4, 8, 12] : [0, 2, 4, 6, 8, 10, 12, 14];
        const stepSet = new Set();
        const goal = Math.min(targetNotes, stepPool.length);

        while (stepSet.size < goal) {
          const openPool = stepPool.filter((step) => !stepSet.has(step) && step % 2 === 0);
          const choice = weightedPick(rng, openPool, (step) => {
            let w = 1;
            if (step % 4 === 0) w += 1.5;
            if (step % 4 === 2) w += 1.0;
            return w;
          });
          if (choice === null || choice === undefined) break;
          stepSet.add(choice);
        }

        const orderedSteps = Array.from(stepSet).sort((a, b) => a - b);
        while (orderedSteps.length > targetNotes + 1) {
          let removeIndex = -1;
          for (let i = orderedSteps.length - 1; i >= 0; i -= 1) {
            if (orderedSteps[i] % 2 === 1) {
              removeIndex = i;
              break;
            }
          }
          if (removeIndex < 0) removeIndex = orderedSteps.length - 1;
          orderedSteps.splice(removeIndex, 1);
        }

        return orderedSteps.map((step) => ({ step, chord: false }));
      }

      function chooseHardBarEvents(rng, targetNotes, density, isIntro) {
        const stepSet = new Set();
        const goal = clamp(targetNotes, 4, 8);

        if (isIntro) {
          stepSet.add(0);
          stepSet.add(4);
          stepSet.add(8);
          stepSet.add(12);
        }

        if (!isIntro && rng() < (0.42 + density * 0.33)) {
          const runLength = randomInt(rng, 3, 5);
          const start = randomInt(rng, 1, 15 - runLength);
          for (let i = 0; i < runLength; i += 1) {
            stepSet.add(start + i);
          }
        }

        while (stepSet.size < goal) {
          const options = [];
          for (let step = 0; step < 16; step += 1) {
            if (!stepSet.has(step) && (step % 2 === 0 || density > 0.8)) options.push(step);
          }
          const choice = weightedPick(rng, options, (step) => {
            let w = 1;
            if (step % 4 === 0) w += 1.5;
            if (step % 4 === 2) w += 1.0;
            if (step % 2 === 1 && density > 0.8) w += 0.2;
            return w;
          });
          if (choice === null || choice === undefined) break;
          stepSet.add(choice);
        }

        const steps = Array.from(stepSet).sort((a, b) => a - b);
        while (steps.length > goal + 1) {
          let removeIndex = -1;
          for (let i = steps.length - 1; i >= 0; i -= 1) {
            if (steps[i] % 4 !== 0) {
              removeIndex = i;
              break;
            }
          }
          if (removeIndex < 0) removeIndex = steps.length - 1;
          steps.splice(removeIndex, 1);
        }

        const chordSteps = new Set();
        if (!isIntro && steps.length > 2 && rng() < (0.14 + density * 0.28)) {
          const firstChord = weightedPick(rng, steps, (step) => (step % 2 === 0 ? 1.3 : 1));
          if (firstChord !== null) chordSteps.add(firstChord);

          if (density > 0.86 && rng() < 0.24) {
            const secondOptions = steps.filter((step) => !chordSteps.has(step) && Math.abs(step - firstChord) >= 2);
            const secondChord = weightedPick(rng, secondOptions, (step) => (step % 2 === 0 ? 1.2 : 0.95));
            if (secondChord !== null) chordSteps.add(secondChord);
          }
        }

        return steps.map((step) => ({ step, chord: chordSteps.has(step) }));
      }

      function buildBarEventsForDifficulty(difficultyId, rng, targetNotes, density, isIntro) {
        if (difficultyId === 'easy') {
          return chooseEasyBarEvents(rng, targetNotes, isIntro);
        }
        if (difficultyId === 'normal') {
          return chooseNormalBarEvents(rng, targetNotes, density, isIntro);
        }
        return chooseHardBarEvents(rng, targetNotes, density, isIntro);
      }

      function updateLaneState(state, lane, absoluteStep) {
        state.laneCounts[lane] += 1;
        if (state.recentLane === lane) {
          state.recentLaneStreak += 1;
        } else {
          state.recentLane = lane;
          state.recentLaneStreak = 1;
        }
        state.lastLane = lane;
        if (absoluteStep !== state.lastStep) {
          state.lastStepLanes = [lane];
        } else if (!state.lastStepLanes.includes(lane)) {
          state.lastStepLanes.push(lane);
        }
        state.lastStep = absoluteStep;
      }

      function detectFastRunEndStep(events) {
        if (!events || events.length <= 0) return -1;
        let runLen = 1;
        let lastStep = events[0].step;
        let runEndStep = -1;
        for (let i = 1; i < events.length; i += 1) {
          const step = events[i].step;
          if (step - lastStep === 1) {
            runLen += 1;
          } else {
            if (runLen >= 3) runEndStep = lastStep;
            runLen = 1;
          }
          lastStep = step;
        }
        if (runLen >= 3) runEndStep = lastStep;
        return runEndStep;
      }

      function pickLaneWithConstraints(rng, state, absoluteStep, stepInBar, patternIndex, difficultyId, excludeLane = -1) {
        const allLanes = [0, 1, 2, 3].filter((lane) => lane !== excludeLane);
        const hints = getMusicalLaneHints(stepInBar, patternIndex);
        const adjacentSixteenth = absoluteStep - state.lastStep === 1;

        let candidates = allLanes.filter((lane) => {
          if (state.recentLaneStreak >= 3 && lane === state.recentLane) return false;
          if (adjacentSixteenth && state.lastStepLanes.includes(lane)) return false;
          return true;
        });

        if (candidates.length <= 0) {
          candidates = allLanes.filter((lane) => !(adjacentSixteenth && state.lastStepLanes.includes(lane)));
        }
        if (candidates.length <= 0) {
          candidates = allLanes.slice();
        }

        const totalPlaced = state.laneCounts[0] + state.laneCounts[1] + state.laneCounts[2] + state.laneCounts[3];
        const avg = (totalPlaced + 1) / 4;

        return weightedPick(rng, candidates, (lane) => {
          const deficit = avg - state.laneCounts[lane];
          let weight = 1 + deficit * 0.95;
          if (hints.includes(lane)) {
            weight *= difficultyId === 'hard' ? 1.45 : 1.32;
          }
          if (lane === state.lastLane) weight *= 0.72;
          return Math.max(0.05, weight);
        });
      }

      function buildChartForDifficulty(difficulty, seed) {
        resetChartContainer();
        game.densityCache = [];

        const fallbackSeed = (Date.now() ^ Math.floor(Math.random() * 0xFFFFFFFF)) >>> 0;
        const baseSeed = ((typeof seed === 'number' ? seed : fallbackSeed) >>> 0) || 1;
        const rng = createSeededRng(mixSeedWithText(baseSeed, difficulty.id));

        const totalBars = Math.ceil(game.totalSteps / 16);
        const introBars = Math.ceil(TUTORIAL_BEATS / 4);
        const state = {
          laneCounts: [0, 0, 0, 0],
          recentLane: -1,
          recentLaneStreak: 0,
          lastLane: -1,
          lastStep: -999,
          lastStepLanes: [],
          restUntilStep: 0
        };

        for (let bar = 0; bar < totalBars; bar += 1) {
          const barStartStep = bar * 16;
          const progress = bar / Math.max(1, totalBars - 1);
          const density = densityCurveAtProgress(progress);
          game.densityCache.push(density);

          const isIntro = bar < introBars;
          const targetNotes = targetNotesForBar(difficulty.id, density, rng, isIntro);
          const events = buildBarEventsForDifficulty(difficulty.id, rng, targetNotes, density, isIntro)
            .sort((a, b) => a.step - b.step);
          const patternIndex = bar % BASS_PATTERN_BARS.length;
          const runEndStep = detectFastRunEndStep(events);

          for (let i = 0; i < events.length; i += 1) {
            const event = events[i];
            const absoluteStep = barStartStep + event.step;
            if (absoluteStep < 0 || absoluteStep >= game.totalSteps) continue;
            if (absoluteStep < state.restUntilStep) continue;

            const firstLane = pickLaneWithConstraints(
              rng,
              state,
              absoluteStep,
              event.step,
              patternIndex,
              difficulty.id,
              -1
            );

            if (firstLane === null || firstLane === undefined) continue;

            addChartNote(absoluteStep * STEP_SEC, firstLane, absoluteStep);
            updateLaneState(state, firstLane, absoluteStep);

            if (difficulty.id === 'hard' && event.chord) {
              const secondLane = pickLaneWithConstraints(
                rng,
                state,
                absoluteStep,
                event.step,
                patternIndex,
                difficulty.id,
                firstLane
              );
              if (secondLane !== null && secondLane !== undefined && secondLane !== firstLane) {
                addChartNote(absoluteStep * STEP_SEC, secondLane, absoluteStep);
                updateLaneState(state, secondLane, absoluteStep);
              }
            }
          }

          if (runEndStep >= 0) {
            state.restUntilStep = Math.max(state.restUntilStep, barStartStep + runEndStep + 4);
          }
        }

        game.chart.sort((a, b) => a.time - b.time || a.lane - b.lane);
        if (game.chart.length <= 0 || game.chart[0].time > 0) {
          const anchorLane = game.chart.length > 0 ? game.chart[0].lane : 0;
          addChartNote(0, anchorLane, 0);
          game.chart.sort((a, b) => a.time - b.time || a.lane - b.lane);
        }
      }

      function buildChartForRhythmStudy(rhythm, difficulty) {
        resetChartContainer();
        game.densityCache = [];

        const totalBars = Math.ceil(game.totalSteps / 16);
        for (let bar = 0; bar < totalBars; bar += 1) {
          const progress = bar / Math.max(1, totalBars - 1);
          game.densityCache.push(densityCurveAtProgress(progress));
        }

        if (!rhythm || !Array.isArray(rhythm.steps) || rhythm.steps.length <= 0) {
          addChartNote(0, 0, 0);
          return;
        }

        const fallbackSeed = (Date.now() ^ Math.floor(Math.random() * 0xFFFFFFFF)) >>> 0;
        const baseSeed = ((typeof game.chartSeed === 'number' ? game.chartSeed : fallbackSeed) >>> 0) || 1;
        const seedLabel = `${difficulty.id}:${rhythm.name}:${rhythm.origin}`;
        const rng = createSeededRng(mixSeedWithText(baseSeed, seedLabel));
        const patternLengthSteps = rhythm.bars === 2 ? 32 : 16;
        const stepSet = new Set(
          rhythm.steps
            .map((step) => Math.floor(Number(step)))
            .filter((step) => Number.isFinite(step) && step >= 0 && step < patternLengthSteps)
        );

        const state = {
          laneCounts: [0, 0, 0, 0],
          recentLane: -1,
          recentLaneStreak: 0,
          lastLane: -1,
          lastStep: -999,
          lastStepLanes: [],
          restUntilStep: 0
        };

        for (let absoluteStep = 0; absoluteStep < game.totalSteps; absoluteStep += 1) {
          if (!stepSet.has(absoluteStep % patternLengthSteps)) continue;

          const stepInBar = absoluteStep % 16;
          const patternIndex = Math.floor(absoluteStep / 16) % BASS_PATTERN_BARS.length;
          const lane = pickLaneWithConstraints(
            rng,
            state,
            absoluteStep,
            stepInBar,
            patternIndex,
            difficulty.id,
            -1
          );
          if (lane === null || lane === undefined) continue;

          addChartNote(absoluteStep * STEP_SEC, lane, absoluteStep);
          updateLaneState(state, lane, absoluteStep);
        }

        game.chart.sort((a, b) => a.time - b.time || a.lane - b.lane);
        if (game.chart.length <= 0 || game.chart[0].time > 0) {
          const anchorLane = game.chart.length > 0 ? game.chart[0].lane : 0;
          addChartNote(0, anchorLane, 0);
          game.chart.sort((a, b) => a.time - b.time || a.lane - b.lane);
        }
      }

      // =========================
      // Game Flow
      // =========================
      function getSongTimeSec() {
        if (game.screen !== 'playing') return 0;

        if (game.usingAudioClock && audio.ctx) {
          return audio.ctx.currentTime - game.songStartAudioTime;
        }

        return (performance.now() - game.songStartPerfTime) / 1000;
      }

      async function startGame() {
        if (game.screen === 'playing') return;

        game.currentDifficulty = DIFFICULTIES[game.selectedDifficulty];
        game.currentMode = game.selectedMode === 'rhythmStudy' ? 'rhythmStudy' : 'freestyle';
        game.currentRhythm = null;

        if (game.currentMode === 'rhythmStudy') {
          const selectedRhythm = getSelectedRhythm();
          if (!selectedRhythm) return;
          game.currentRhythm = selectedRhythm;
        }

        const leadInSec = game.currentDifficulty.approachSec + COUNTDOWN_SEC;

        game.chartSeed = (Date.now() ^ Math.floor(Math.random() * 0xFFFFFFFF) ^ Math.floor(performance.now() * 1000)) >>> 0;
        if (game.chartSeed === 0) game.chartSeed = 1;
        if (game.currentMode === 'rhythmStudy' && game.currentRhythm) {
          buildChartForRhythmStudy(game.currentRhythm, game.currentDifficulty);
        } else {
          buildChartForDifficulty(game.currentDifficulty, game.chartSeed);
        }

        game.score = 0;
        game.combo = 0;
        game.maxCombo = 0;
        game.health = 100;
        game.judgedCount = 0;
        game.judgments.perfect = 0;
        game.judgments.great = 0;
        game.judgments.good = 0;
        game.judgments.miss = 0;
        clearTransientEffects();
        game.laneFlash = [0, 0, 0, 0];
        game.laneFlashWhite = [0, 0, 0, 0];
        game.lanePressedKeyboard = [false, false, false, false];
        game.lanePressedTouch = [false, false, false, false];
        game.activePointers.clear();
        game.comboPop = 0;
        game.comboSad = 0;
        game.milestoneFlash = 0;
        game.beatPulse = 0;
        game.lastBeatIndex = -1;
        game.screenShake.amplitude = 0;
        game.screenShake.life = 0;
        game.missFlash = 0;
        game.frameFlash = 0;
        game.completed = false;

        runtime.songTimePrev = -leadInSec;
        runtime.songTimeCurr = -leadInSec;
        runtime.accumulator = 0;

        game.songStartPerfTime = performance.now() + leadInSec * 1000;
        game.usingAudioClock = false;
        game.screen = 'playing';

        try {
          await ensureAudioContext();
          const countInAudioStart = audio.ctx.currentTime + AUDIO_START_DELAY_SEC;
          game.songStartAudioTime = countInAudioStart + leadInSec;
          game.songStartPerfTime = performance.now() + (leadInSec + AUDIO_START_DELAY_SEC) * 1000;
          game.usingAudioClock = true;
          scheduleCountdownBar(game.songStartAudioTime - COUNTDOWN_SEC);
          startScheduledAudio(game.songStartAudioTime, game.totalSteps);
        } catch (err) {
          game.songStartPerfTime = performance.now() + leadInSec * 1000;
          game.usingAudioClock = false;
        }

      }

      function endGame(completed) {
        if (game.screen !== 'playing') return;
        game.completed = completed;
        game.screen = 'gameover';
        stopScheduledAudio();
        maybeUpdateHighScore();
      }

      // =========================
      // Input and Judging
      // =========================
      function judgmentFromDeltaMs(absMs) {
        const timing = timingWindowsForCurrentDifficulty();
        if (absMs <= timing.perfect) return 'perfect';
        if (absMs <= timing.great) return 'great';
        if (absMs <= timing.good) return 'good';
        return 'miss';
      }

      function spawnParticleBurst(x, y, count, color, speedMin, speedMax, sizeBase, lifeMin, lifeRange, upwardBias = 0) {
        for (let i = 0; i < count; i += 1) {
          const particle = allocParticleFromPool();
          if (!particle) break;

          const angle = (Math.PI * 2 * (i / Math.max(1, count))) + hash01((i + 1) * 39.17 + runtime.elapsedSec * 7.1) * 0.95;
          const speed = speedMin + hash01((i + 2) * 21.9 + runtime.elapsedSec * 1.7) * (speedMax - speedMin);
          const life = lifeMin + hash01((i + 11) * 13.7 + runtime.elapsedSec * 2.4) * lifeRange;

          particle.x = x;
          particle.y = y;
          particle.vx = Math.cos(angle) * speed;
          particle.vy = Math.sin(angle) * speed - upwardBias;
          particle.life = life;
          particle.maxLife = life;
          particle.size = sizeBase + hash01((i + 3) * 17.3 + runtime.elapsedSec * 3.3) * 1.4;
          particle.color = color;
        }
      }

      function spawnHitParticles(lane, quality) {
        const centerX = layout.laneCenters[lane];
        const centerY = layout.hitY;
        const count = quality === 'perfect' ? 12 : quality === 'great' ? 10 : 8;
        const color = quality === 'perfect'
          ? PALETTE.pink
          : quality === 'great'
            ? PALETTE.magenta
            : PALETTE.violet;
        spawnParticleBurst(centerX, centerY, count, color, 130, 245, 2.5, 0.32, 0.22, 34);
      }

      function spawnPerfectStarburst(lane) {
        const centerX = layout.laneCenters[lane];
        const centerY = layout.hitY - 4;
        spawnParticleBurst(centerX, centerY, 14, '#ffffff', 170, 290, 2.2, 0.22, 0.18, 10);
      }

      function spawnComboMilestoneBurst() {
        const centerX = width * 0.5;
        const centerY = height * 0.15;
        spawnParticleBurst(centerX, centerY, 24, PALETTE.pink, 110, 260, 2.4, 0.34, 0.2, 20);
      }

      function pushJudgmentPopup(lane, text, color) {
        const popup = allocPopupFromPool();
        if (!popup) return;
        popup.text = text;
        popup.color = color;
        popup.x = layout.laneCenters[lane];
        popup.y = layout.hitY - 18;
        popup.vy = -58;
        popup.life = 0.35;
        popup.maxLife = 0.35;
        popup.startScale = 1.3;
        popup.endScale = 1.0;
        popup.scale = popup.startScale;
      }

      function triggerMissFeedback(previousCombo) {
        game.missFlash = Math.max(game.missFlash, 1);
        game.screenShake.amplitude = Math.max(game.screenShake.amplitude, 4);
        game.screenShake.life = game.screenShake.maxLife;
        if (previousCombo > 10) {
          game.comboSad = Math.max(game.comboSad, 1);
        }
      }

      function applyJudgment(note, quality, deltaMs) {
        note.judged = true;
        note.hit = quality !== 'miss';
        note.miss = quality === 'miss';
        game.judgedCount += 1;

        const lane = note.lane;
        triggerChartMelody(note, quality);

        if (quality === 'miss') {
          const comboBeforeMiss = game.combo;
          game.judgments.miss += 1;
          game.combo = 0;
          game.health = clamp(game.health - game.currentDifficulty.missDamage, 0, 100);
          game.laneFlash[lane] = Math.max(game.laneFlash[lane], 0.45);
          game.laneFlashWhite[lane] = Math.max(game.laneFlashWhite[lane], 0.25);
          pushJudgmentPopup(lane, 'MISS', PALETTE.red);
          spawnParticleBurst(layout.laneCenters[lane], layout.hitY, 8, PALETTE.red, 80, 160, 2.2, 0.24, 0.16, 0);
          triggerMissFeedback(comboBeforeMiss);

          if (navigator.vibrate) {
            navigator.vibrate(8);
          }
          return;
        }

        game.judgments[quality] += 1;

        game.combo += 1;
        game.maxCombo = Math.max(game.maxCombo, game.combo);

        const mult = comboMultiplier(game.combo);
        const base = BASE_POINTS[quality];
        game.score += base * mult;

        const heal = game.currentDifficulty.hitHeal[quality] || 0;
        game.health = clamp(game.health + heal, 0, 100);

        game.laneFlash[lane] = Math.max(game.laneFlash[lane], quality === 'perfect' ? 1 : quality === 'great' ? 0.82 : 0.7);
        game.laneFlashWhite[lane] = 1;
        game.comboPop = Math.max(game.comboPop, 1);

        if (quality === 'perfect') {
          pushJudgmentPopup(lane, 'PERFECT', PALETTE.pink);
          spawnPerfectStarburst(lane);
          game.frameFlash = Math.max(game.frameFlash, 0.05);
        } else if (quality === 'great') {
          pushJudgmentPopup(lane, 'GREAT', PALETTE.magenta);
        } else {
          pushJudgmentPopup(lane, 'GOOD', PALETTE.violet);
        }

        spawnHitParticles(lane, quality);

        if (COMBO_MILESTONES.includes(game.combo)) {
          game.milestoneFlash = Math.max(game.milestoneFlash, 1);
          game.frameFlash = Math.max(game.frameFlash, 0.08);
          spawnComboMilestoneBurst();
        }

        if (navigator.vibrate && quality === 'perfect') {
          navigator.vibrate(6);
        }
      }

      function attemptLaneHit(lane) {
        if (game.screen !== 'playing') return;

        const songTime = getSongTimeSec();
        if (songTime < -BEAT_SEC) {
          game.laneFlash[lane] = Math.max(game.laneFlash[lane], 0.2);
          return;
        }
        const windowSec = timingWindowsForCurrentDifficulty().good / 1000;

        let best = null;
        let bestAbs = Infinity;

        for (let i = 0; i < game.chart.length; i += 1) {
          const note = game.chart[i];
          if (note.judged || note.lane !== lane) continue;

          const deltaSec = songTime - note.time;
          const absSec = Math.abs(deltaSec);

          if (absSec <= windowSec && absSec < bestAbs) {
            best = note;
            bestAbs = absSec;
          }

          if (note.time - songTime > windowSec) {
            // Chart sorted by time; notes beyond this point are too early.
            break;
          }
        }

        if (!best) {
          game.laneFlash[lane] = Math.max(game.laneFlash[lane], 0.35);
          return;
        }

        const deltaMs = (songTime - best.time) * 1000;
        const quality = judgmentFromDeltaMs(Math.abs(deltaMs));
        applyJudgment(best, quality, deltaMs);
      }

      function processMissedNotes(songTime) {
        const missWindowSec = timingWindowsForCurrentDifficulty().good / 1000;

        for (let i = 0; i < game.chart.length; i += 1) {
          const note = game.chart[i];
          if (note.judged) continue;

          if (songTime - note.time > missWindowSec) {
            applyJudgment(note, 'miss', missWindowSec * 1000);
          } else {
            // Remaining notes are in the future.
            break;
          }
        }
      }

      function handleKeyDown(event) {
        primeAudioFromGesture();
        const lane = KEY_TO_LANE[event.code];

        if (game.screen === 'playing') {
          if (lane !== undefined) {
            if (!game.lanePressedKeyboard[lane]) {
              attemptLaneHit(lane);
            }
            game.lanePressedKeyboard[lane] = true;
            event.preventDefault();
            return;
          }
        }

        if (game.screen === 'start') {
          if (game.startStage === 'splash') {
            if (event.code === 'Space' || event.code === 'Enter') {
              if (!event.repeat) {
                game.startStage = 'difficulty';
              }
              event.preventDefault();
            }
            return;
          }

          if (event.code === 'ArrowLeft') {
            game.selectedDifficulty = (game.selectedDifficulty + DIFFICULTIES.length - 1) % DIFFICULTIES.length;
            event.preventDefault();
            return;
          }

          if (event.code === 'ArrowRight') {
            game.selectedDifficulty = (game.selectedDifficulty + 1) % DIFFICULTIES.length;
            event.preventDefault();
            return;
          }

          if (event.code === 'Digit1') {
            game.selectedDifficulty = 0;
            event.preventDefault();
            return;
          }

          if (event.code === 'Digit2') {
            game.selectedDifficulty = 1;
            event.preventDefault();
            return;
          }

          if (event.code === 'Digit3') {
            game.selectedDifficulty = 2;
            event.preventDefault();
            return;
          }

          if (event.code === 'KeyF') {
            setSelectedMode('freestyle');
            event.preventDefault();
            return;
          }

          if (event.code === 'KeyR') {
            setSelectedMode('rhythmStudy');
            event.preventDefault();
            return;
          }

          if (event.code === 'KeyM') {
            toggleSelectedMode();
            event.preventDefault();
            return;
          }

          if (game.selectedMode === 'rhythmStudy') {
            if (event.code === 'ArrowUp') {
              cycleRhythmFamily(-1);
              event.preventDefault();
              return;
            }

            if (event.code === 'ArrowDown') {
              cycleRhythmFamily(1);
              event.preventDefault();
              return;
            }

            if (event.code === 'KeyQ') {
              cycleRhythmChoice(-1);
              event.preventDefault();
              return;
            }

            if (event.code === 'KeyE') {
              cycleRhythmChoice(1);
              event.preventDefault();
              return;
            }

            if (event.code === 'KeyZ') {
              adjustRhythmDifficultyFilter(-1);
              event.preventDefault();
              return;
            }

            if (event.code === 'KeyX') {
              adjustRhythmDifficultyFilter(1);
              event.preventDefault();
              return;
            }

            if (event.code === 'KeyC') {
              setRhythmDifficultyFilter(0);
              event.preventDefault();
              return;
            }
          }

          if (event.code === 'Space' || event.code === 'Enter') {
            if (!event.repeat) {
              startGame();
            }
            event.preventDefault();
            return;
          }

          if (event.code === 'Escape') {
            game.startStage = 'splash';
            event.preventDefault();
          }
          return;
        }

        if (game.screen === 'gameover') {
          if (event.code === 'Space' || event.code === 'Enter') {
            game.screen = 'start';
            game.startStage = 'splash';
            event.preventDefault();
          }
        }
      }

      function handleKeyUp(event) {
        const lane = KEY_TO_LANE[event.code];
        if (lane !== undefined) {
          game.lanePressedKeyboard[lane] = false;
        }
      }

      function pointerLaneFromCoords(clientX, clientY) {
        if (clientY < layout.touchTopY) return -1;
        const lane = Math.floor((clientX / width) * 4);
        return clamp(lane, 0, 3);
      }

      function recomputeTouchLanePressed() {
        game.lanePressedTouch = [false, false, false, false];
        game.activePointers.forEach((lane) => {
          if (lane >= 0 && lane < 4) {
            game.lanePressedTouch[lane] = true;
          }
        });
      }

      function hitTestButtons(buttons, x, y) {
        for (let i = 0; i < buttons.length; i += 1) {
          const button = buttons[i];
          if (x >= button.x && x <= button.x + button.w && y >= button.y && y <= button.y + button.h) {
            return button;
          }
        }
        return null;
      }

      function hitTestDifficultyButtons(x, y) {
        const hit = hitTestButtons(layout.difficultyButtons, x, y);
        return hit ? hit.index : -1;
      }

      function hitTestModeButtons(x, y) {
        const hit = hitTestButtons(layout.modeButtons, x, y);
        return hit ? hit.modeId : null;
      }

      function hitTestRhythmFamilyButtons(x, y) {
        const hit = hitTestButtons(layout.rhythmFamilyButtons, x, y);
        return hit ? hit.direction : 0;
      }

      function hitTestRhythmDifficultyButtons(x, y) {
        const hit = hitTestButtons(layout.rhythmDifficultyButtons, x, y);
        return hit ? hit.filter : null;
      }

      function hitTestRhythmNavButtons(x, y) {
        const hit = hitTestButtons(layout.rhythmNavButtons, x, y);
        return hit ? hit.direction : 0;
      }

      function handlePointerDown(event) {
        primeAudioFromGesture();
        const x = event.clientX;
        const y = event.clientY;

        if (game.screen === 'start') {
          if (game.startStage === 'splash') {
            game.startStage = 'difficulty';
            event.preventDefault();
            return;
          }

          const modeHit = hitTestModeButtons(x, y);
          if (modeHit) {
            setSelectedMode(modeHit);
            event.preventDefault();
            return;
          }

          const difficultyHit = hitTestDifficultyButtons(x, y);
          if (difficultyHit >= 0) {
            game.selectedDifficulty = difficultyHit;
            event.preventDefault();
            return;
          }

          if (game.selectedMode === 'rhythmStudy') {
            const familyDirection = hitTestRhythmFamilyButtons(x, y);
            if (familyDirection !== 0) {
              cycleRhythmFamily(familyDirection);
              event.preventDefault();
              return;
            }

            const difficultyFilter = hitTestRhythmDifficultyButtons(x, y);
            if (difficultyFilter !== null) {
              setRhythmDifficultyFilter(difficultyFilter);
              event.preventDefault();
              return;
            }

            const rhythmDirection = hitTestRhythmNavButtons(x, y);
            if (rhythmDirection !== 0) {
              cycleRhythmChoice(rhythmDirection);
              event.preventDefault();
              return;
            }
          }

          startGame();
          event.preventDefault();
          return;
        }

        if (game.screen === 'gameover') {
          game.screen = 'start';
          game.startStage = 'splash';
          event.preventDefault();
          return;
        }

        if (game.screen !== 'playing') return;

        const lane = pointerLaneFromCoords(x, y);
        game.activePointers.set(event.pointerId, lane);
        recomputeTouchLanePressed();

        if (lane >= 0) {
          attemptLaneHit(lane);
        }

        event.preventDefault();
      }

      function handlePointerMove(event) {
        if (game.screen !== 'playing') return;
        if (!game.activePointers.has(event.pointerId)) return;

        const lane = pointerLaneFromCoords(event.clientX, event.clientY);
        const previousLane = game.activePointers.get(event.pointerId);

        if (lane !== previousLane) {
          game.activePointers.set(event.pointerId, lane);
          recomputeTouchLanePressed();
          if (lane >= 0) {
            attemptLaneHit(lane);
          }
        }
      }

      function handlePointerUp(event) {
        if (game.activePointers.has(event.pointerId)) {
          game.activePointers.delete(event.pointerId);
          recomputeTouchLanePressed();
        }
      }

      // =========================
      // Visual Initialization
      // =========================
      function initStars() {
        game.stars.length = 0;
        const starCount = 170;
        for (let i = 0; i < starCount; i += 1) {
          game.stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            z: 0.2 + Math.random() * 0.8,
            twinkle: Math.random() * Math.PI * 2,
            driftX: (Math.random() * 2 - 1) * (0.6 + Math.random() * 0.8),
            driftY: 0.6 + Math.random() * 1.4
          });
        }
      }

      function resize() {
        dpr = clamp(window.devicePixelRatio || 1, 1, 2);
        width = Math.max(320, window.innerWidth);
        height = Math.max(560, window.innerHeight);

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        layout.playAreaWidth = Math.min(width * 0.82, 560);
        layout.playAreaX = (width - layout.playAreaWidth) * 0.5;
        layout.laneOuterWidth = layout.playAreaWidth / 4;
        layout.lanePadding = Math.max(3, layout.laneOuterWidth * 0.05);
        layout.laneInnerWidth = layout.laneOuterWidth - layout.lanePadding * 2;
        layout.laneTop = height * 0.08;
        layout.hitY = height * 0.8;
        layout.touchTopY = height * 0.6;

        for (let i = 0; i < 4; i += 1) {
          const x = layout.playAreaX + i * layout.laneOuterWidth + layout.lanePadding;
          layout.laneCenters[i] = x + layout.laneInnerWidth * 0.5;
        }

        initStars();
      }

      // =========================
      // Update Loop
      // =========================
      function updateStars(dt, songTime) {
        const pulse = game.screen === 'playing' ? game.beatPulse : 0.35 + 0.15 * Math.sin(runtime.elapsedSec * 1.7);
        const drift = 2.6 + pulse * 3.3;

        for (let i = 0; i < game.stars.length; i += 1) {
          const star = game.stars[i];
          star.x += star.driftX * dt * (0.8 + star.z * 0.7);
          star.y += (drift + star.driftY) * dt * (0.35 + star.z * 0.8);
          star.twinkle += dt * (1.2 + star.z * 2.2);
          if (star.x < -6) star.x = width + 6;
          if (star.x > width + 6) star.x = -6;
          if (star.y > height + 8) {
            star.y = -8;
            star.x = Math.random() * width;
            star.z = 0.2 + Math.random() * 0.8;
            star.driftX = (Math.random() * 2 - 1) * (0.6 + Math.random() * 0.8);
            star.driftY = 0.6 + Math.random() * 1.4;
          }
        }
      }

      function updatePopups(dt) {
        for (let i = game.popups.length - 1; i >= 0; i -= 1) {
          const popup = game.popups[i];
          popup.life -= dt;
          popup.y += popup.vy * dt;
          const progress = 1 - clamp(popup.life / Math.max(0.0001, popup.maxLife), 0, 1);
          const popProgress = clamp(progress / (0.2 / Math.max(0.2, popup.maxLife)), 0, 1);
          popup.scale = lerp(popup.startScale, popup.endScale, easeOutCubic(popProgress));
          if (popup.life <= 0) {
            popup.active = false;
            game.popups.splice(i, 1);
          }
        }
      }

      function updateParticles(dt) {
        for (let i = game.particles.length - 1; i >= 0; i -= 1) {
          const particle = game.particles[i];
          particle.life -= dt;
          particle.vy += 280 * dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vx *= 0.986;
          particle.vy *= 0.986;

          if (particle.life <= 0) {
            particle.active = false;
            game.particles.splice(i, 1);
          }
        }
      }

      function updateVisualEffects(dt) {
        for (let i = 0; i < 4; i += 1) {
          game.laneFlash[i] = Math.max(0, game.laneFlash[i] - dt * 4.2);
          game.laneFlashWhite[i] = Math.max(0, game.laneFlashWhite[i] - dt * 10);
        }

        game.comboPop = Math.max(0, game.comboPop - dt * 7.5);
        game.comboSad = Math.max(0, game.comboSad - dt * 6.2);
        game.milestoneFlash = Math.max(0, game.milestoneFlash - dt * 4.6);
        game.missFlash = Math.max(0, game.missFlash - dt * 6.7);

        if (game.screenShake.life > 0) {
          game.screenShake.life = Math.max(0, game.screenShake.life - dt);
          game.screenShake.amplitude *= Math.exp(-dt * 22);
        } else {
          game.screenShake.amplitude = 0;
        }
      }

      function updatePlaying(dt) {
        scheduleAudioAhead();

        runtime.songTimePrev = runtime.songTimeCurr;
        const songTime = getSongTimeSec();
        runtime.songTimeCurr = songTime;

        if (songTime >= 0) {
          const beatIndex = Math.floor(songTime / BEAT_SEC);
          if (beatIndex !== game.lastBeatIndex) {
            game.lastBeatIndex = beatIndex;
            game.beatPulse = beatIndex % 4 === 0 ? 1.3 : 1.0;
          }
          game.beatPulse = Math.max(0, game.beatPulse - dt * 2.6);
          processMissedNotes(songTime);
        } else {
          game.lastBeatIndex = -1;
          game.beatPulse = Math.max(0, game.beatPulse - dt * 3.2);
        }

        if (game.health <= 0) {
          endGame(false);
          return;
        }

        if (songTime > (game.totalBeats * BEAT_SEC) + 0.9 && game.judgedCount >= game.chart.length) {
          endGame(true);
          return;
        }

        updateVisualEffects(dt);
        updateParticles(dt);
        updatePopups(dt);
        updateStars(dt, songTime);
      }

      function updateNonPlaying(dt) {
        runtime.songTimePrev = runtime.songTimeCurr;
        runtime.songTimeCurr = runtime.elapsedSec * 0.6;
        game.beatPulse = 0.4 + 0.35 * Math.sin(runtime.elapsedSec * 2.2);
        updateVisualEffects(dt);
        updateParticles(dt);
        updatePopups(dt);
        updateStars(dt, 0);
      }

      function update(dt) {
        if (game.screen === 'playing') {
          updatePlaying(dt);
        } else {
          updateNonPlaying(dt);
        }
      }

      // =========================
      // Rendering - Background
      // =========================
      function renderBackground(songTime) {
        const horizonY = height * 0.36;
        const songProgress = clamp(songTime / Math.max(0.001, game.totalBeats * BEAT_SEC), 0, 1);
        const density = game.screen === 'playing' ? densityCurveAtProgress(songProgress) : 0.52;
        const chorusBoost = game.screen === 'playing' && density > 0.86
          ? (density - 0.86) / 0.14
          : 0;
        const pulse = game.screen === 'playing'
          ? (0.2 + game.beatPulse * (0.45 + chorusBoost * 0.35))
          : (0.2 + 0.25 * Math.sin(runtime.elapsedSec * 1.8));

        ctx.fillStyle = PALETTE.black;
        ctx.fillRect(0, 0, width, height);

        // Deep glow
        const glow = ctx.createRadialGradient(width * 0.5, horizonY, 30, width * 0.5, horizonY, height * 1.1);
        glow.addColorStop(0, 'rgba(149,49,242,0.30)');
        glow.addColorStop(0.35, 'rgba(40,9,175,0.24)');
        glow.addColorStop(1, 'rgba(10,10,15,1)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);

        // Stars
        for (let i = 0; i < game.stars.length; i += 1) {
          const star = game.stars[i];
          const twinkle = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(star.twinkle));
          const alpha = (0.22 + star.z * 0.6) * twinkle;
          const color = i % 3 === 0 ? PALETTE.pink : i % 3 === 1 ? PALETTE.violet : PALETTE.magenta;
          ctx.fillStyle = color;
          ctx.globalAlpha = alpha;
          const size = 0.6 + star.z * 1.8;
          ctx.fillRect(star.x, star.y, size, size);
        }
        ctx.globalAlpha = 1;

        // Neon sun
        const sunRadius = Math.min(width, height) * (0.145 + pulse * 0.028 + chorusBoost * 0.035);
        const sunY = horizonY + 6;

        const sunGradient = ctx.createRadialGradient(width * 0.5, sunY, sunRadius * 0.1, width * 0.5, sunY, sunRadius);
        sunGradient.addColorStop(0, PALETTE.pink);
        sunGradient.addColorStop(0.36, PALETTE.magenta);
        sunGradient.addColorStop(0.68, PALETTE.red);
        sunGradient.addColorStop(1, PALETTE.violet);

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, width, horizonY + 20);
        ctx.clip();

        ctx.globalAlpha = 0.9;
        ctx.fillStyle = sunGradient;
        ctx.beginPath();
        ctx.arc(width * 0.5, sunY, sunRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 0.82;
        ctx.strokeStyle = PALETTE.pink;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 24;
        ctx.shadowColor = PALETTE.pink;
        ctx.beginPath();
        ctx.arc(width * 0.5, sunY, sunRadius * 1.02, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.globalAlpha = 0.62;
        ctx.strokeStyle = PALETTE.black;
        for (let i = 1; i < 12; i += 1) {
          const y = sunY - sunRadius + (i / 12) * sunRadius * 2;
          const wobble = Math.sin(runtime.elapsedSec * 2.5 + i * 0.6) * 4;
          ctx.beginPath();
          ctx.moveTo(width * 0.5 - sunRadius, y + wobble);
          ctx.lineTo(width * 0.5 + sunRadius, y - wobble);
          ctx.stroke();
        }

        ctx.restore();
        ctx.globalAlpha = 1;

        // Perspective floor grid
        const floorTop = horizonY + 4;
        const floorBottom = height + 30;
        const centerX = width * 0.5;
        const comboSpeedBoost = game.screen === 'playing' ? clamp(game.combo / 180, 0, 1) * 0.18 : 0;
        const travel = Math.max(songTime, 0) * (game.screen === 'playing' ? (1.8 + comboSpeedBoost) : 0.55);

        // Horizontal grid lines
        for (let i = 1; i <= 26; i += 1) {
          const z = ((i / 26) + travel * 0.18) % 1;
          const depth = z * z;
          const y = floorTop + depth * (floorBottom - floorTop);
          const alpha = 0.08 + (1 - z) * 0.34 + pulse * 0.08;

          ctx.strokeStyle = i % 2 === 0 ? PALETTE.violet : PALETTE.indigo;
          ctx.globalAlpha = alpha;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(layout.playAreaX - 140, y);
          ctx.lineTo(layout.playAreaX + layout.playAreaWidth + 140, y);
          ctx.stroke();
        }

        // Vertical perspective lines
        for (let i = -14; i <= 14; i += 1) {
          const t = i / 14;
          const xTop = centerX + t * 20;
          const xBottom = centerX + t * (layout.playAreaWidth * 0.8 + 210);

          ctx.strokeStyle = i % 2 === 0 ? PALETTE.indigo : PALETTE.violet;
          ctx.globalAlpha = 0.12 + pulse * 0.08;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(xTop, floorTop);
          ctx.lineTo(xBottom, floorBottom);
          ctx.stroke();
        }

        ctx.globalAlpha = 1;
      }

      // =========================
      // Rendering - Gameplay Layer
      // =========================
      function noteYForTime(noteTimeSec, songTimeSec, approachSec) {
        const delta = noteTimeSec - songTimeSec;
        const progress = 1 - (delta / approachSec);
        return layout.laneTop + progress * (layout.hitY - layout.laneTop);
      }

      function renderLanes(songTime) {
        const approach = game.currentDifficulty.approachSec;
        const goodWindowSec = timingWindowsForCurrentDifficulty().good / 1000;
        const noteHeight = Math.max(14, height * 0.024);

        // Touch lane overlays for mobile support (bottom 40%).
        for (let lane = 0; lane < 4; lane += 1) {
          const tx = width * lane * 0.25;
          const tw = width * 0.25;
          const active = getLanePressed(lane);
          ctx.fillStyle = LANE_COLORS[lane];
          ctx.globalAlpha = active ? 0.16 : 0.07;
          ctx.fillRect(tx, layout.touchTopY, tw, height - layout.touchTopY);

          ctx.globalAlpha = active ? 0.8 : 0.42;
          ctx.strokeStyle = LANE_COLORS[lane];
          ctx.lineWidth = 1;
          ctx.strokeRect(tx + 0.5, layout.touchTopY + 0.5, tw - 1, height - layout.touchTopY - 1);
        }
        ctx.globalAlpha = 1;

        // Lane columns
        for (let lane = 0; lane < 4; lane += 1) {
          const laneX = layout.playAreaX + lane * layout.laneOuterWidth + layout.lanePadding;
          const pressed = getLanePressed(lane);
          const flash = game.laneFlash[lane];
          const whiteFlash = game.laneFlashWhite[lane];

          const baseAlpha = 0.12 + flash * 0.18 + (pressed ? 0.14 : 0);
          ctx.fillStyle = LANE_COLORS[lane];
          ctx.globalAlpha = baseAlpha;
          drawRoundedRect(ctx, laneX, layout.laneTop, layout.laneInnerWidth, layout.hitY - layout.laneTop + 28, 8);
          ctx.fill();

          if (whiteFlash > 0) {
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.36 * whiteFlash;
            drawRoundedRect(ctx, laneX, layout.laneTop, layout.laneInnerWidth, layout.hitY - layout.laneTop + 28, 8);
            ctx.fill();
          }

          ctx.globalAlpha = 0.55 + flash * 0.35;
          ctx.strokeStyle = whiteFlash > 0.02 ? '#ffffff' : LANE_COLORS[lane];
          ctx.lineWidth = pressed ? 2.6 : 1.4;
          drawRoundedRect(ctx, laneX, layout.laneTop, layout.laneInnerWidth, layout.hitY - layout.laneTop + 28, 8);
          ctx.stroke();

          // Key labels at the bottom.
          ctx.globalAlpha = 0.95;
          ctx.fillStyle = PALETTE.pink;
          ctx.font = `700 ${Math.max(15, Math.floor(width * 0.02))}px monospace`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(LANE_LABELS[lane], layout.laneCenters[lane], layout.hitY + 42);
        }

        ctx.globalAlpha = 1;

        // Hit zone line
        const hitGlow = 0.35 + game.beatPulse * 0.25;
        const zoneGradient = ctx.createLinearGradient(layout.playAreaX, layout.hitY, layout.playAreaX + layout.playAreaWidth, layout.hitY);
        zoneGradient.addColorStop(0, PALETTE.violet);
        zoneGradient.addColorStop(0.35, PALETTE.pink);
        zoneGradient.addColorStop(0.65, PALETTE.magenta);
        zoneGradient.addColorStop(1, PALETTE.red);

        ctx.globalAlpha = hitGlow;
        ctx.strokeStyle = zoneGradient;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(layout.playAreaX, layout.hitY);
        ctx.lineTo(layout.playAreaX + layout.playAreaWidth, layout.hitY);
        ctx.stroke();
        ctx.globalAlpha = 1;

        const upcomingByLane = [[], [], [], []];
        const visibleNotes = [];

        for (let i = 0; i < game.chart.length; i += 1) {
          const note = game.chart[i];
          if (note.judged && note.hit) continue;

          const delta = note.time - songTime;
          if (delta > approach || delta < -0.22) continue;

          const lane = note.lane;
          const laneX = layout.playAreaX + lane * layout.laneOuterWidth + layout.lanePadding;
          const y = noteYForTime(note.time, songTime, approach);
          const widthPad = 8;
          const nx = laneX + widthPad;
          const nw = layout.laneInnerWidth - widthPad * 2;
          const ny = y - noteHeight * 0.5;
          const near = clamp(1 - Math.abs(delta) / goodWindowSec, 0, 1);
          const color = LANE_COLORS[lane];

          visibleNotes.push({
            note,
            delta,
            lane,
            nx,
            ny,
            nw,
            near,
            color
          });

          if (!note.miss && delta >= 0) {
            upcomingByLane[lane].push(y);
          }
        }

        // Approach indicators: link upcoming notes in the same lane.
        for (let lane = 0; lane < 4; lane += 1) {
          const ys = upcomingByLane[lane];
          if (ys.length < 2) continue;
          ctx.globalAlpha = 0.16;
          ctx.strokeStyle = LANE_COLORS[lane];
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.moveTo(layout.laneCenters[lane], ys[0]);
          for (let i = 1; i < ys.length; i += 1) {
            ctx.lineTo(layout.laneCenters[lane], ys[i]);
          }
          ctx.stroke();
        }

        // Notes with subtle bloom: blurred pass first, sharp pass second.
        for (let i = 0; i < visibleNotes.length; i += 1) {
          const data = visibleNotes[i];
          const { note, delta, nx, ny, nw, near, color } = data;

          ctx.save();
          ctx.fillStyle = color;
          ctx.globalAlpha = 0.16 + near * 0.14;
          ctx.shadowBlur = 14;
          ctx.shadowColor = color;
          drawRoundedRect(ctx, nx - 2, ny - 2, nw + 4, noteHeight + 4, 7);
          ctx.fill();
          ctx.restore();

          ctx.fillStyle = color;
          ctx.globalAlpha = 0.58 + near * 0.28 + (note.miss ? 0.12 : 0);
          drawRoundedRect(ctx, nx, ny, nw, noteHeight, 6);
          ctx.fill();

          if (!note.miss && delta >= 0) {
            ctx.globalAlpha = 0.15 + near * 0.11;
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(nx + nw * 0.5, ny);
            ctx.lineTo(nx + nw * 0.5, ny - 18 - near * 18);
            ctx.stroke();
          }

          ctx.globalAlpha = 0.86 + near * 0.08;
          ctx.strokeStyle = PALETTE.black;
          ctx.lineWidth = 1;
          drawRoundedRect(ctx, nx, ny, nw, noteHeight, 6);
          ctx.stroke();
        }

        ctx.globalAlpha = 1;
      }

      function renderParticlesAndPopups() {
        for (let i = 0; i < game.particles.length; i += 1) {
          const p = game.particles[i];
          const alpha = clamp(p.life / p.maxLife, 0, 1);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (0.6 + alpha * 0.9), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        for (let i = 0; i < game.popups.length; i += 1) {
          const popup = game.popups[i];
          const alpha = clamp(popup.life / popup.maxLife, 0, 1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(popup.x, popup.y);
          ctx.scale(popup.scale, popup.scale);
          ctx.fillStyle = popup.color;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = `700 ${Math.floor(18 * (0.9 + alpha * 0.25))}px monospace`;
          ctx.fillText(popup.text, 0, 0);
          ctx.restore();
        }

        ctx.globalAlpha = 1;
      }

      function renderRhythmStudyBanner() {
        if (game.currentMode !== 'rhythmStudy' || !game.currentRhythm) return;

        const rhythm = game.currentRhythm;
        const bannerW = Math.min(layout.playAreaWidth + 120, width * 0.94);
        const bannerH = Math.max(72, Math.floor(height * 0.12));
        const bannerX = (width - bannerW) * 0.5;
        const bannerY = Math.max(6, layout.laneTop - bannerH * 0.32);
        const bannerGradient = ctx.createLinearGradient(bannerX, bannerY, bannerX, bannerY + bannerH);

        bannerGradient.addColorStop(0, 'rgba(10,10,15,0.92)');
        bannerGradient.addColorStop(1, 'rgba(40,9,175,0.52)');

        ctx.globalAlpha = 0.74;
        ctx.fillStyle = bannerGradient;
        drawRoundedRect(ctx, bannerX, bannerY, bannerW, bannerH, 12);
        ctx.fill();

        ctx.globalAlpha = 0.86;
        ctx.strokeStyle = PALETTE.magenta;
        ctx.lineWidth = 1.5;
        drawRoundedRect(ctx, bannerX, bannerY, bannerW, bannerH, 12);
        ctx.stroke();

        ctx.globalAlpha = 1;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const nameY = bannerY + Math.floor(bannerH * 0.29);
        const originY = bannerY + Math.floor(bannerH * 0.58);
        const descY = bannerY + Math.floor(bannerH * 0.82);

        ctx.fillStyle = PALETTE.pink;
        ctx.font = `800 ${Math.max(13, Math.floor(width * 0.018))}px monospace`;
        ctx.fillText(trimTextToWidth(rhythm.name, bannerW - 22), width * 0.5, nameY);

        ctx.fillStyle = PALETTE.magenta;
        ctx.font = `600 ${Math.max(10, Math.floor(width * 0.014))}px monospace`;
        ctx.fillText(trimTextToWidth(rhythm.origin, bannerW - 26), width * 0.5, originY);

        ctx.fillStyle = PALETTE.violet;
        ctx.font = `600 ${Math.max(9, Math.floor(width * 0.012))}px monospace`;
