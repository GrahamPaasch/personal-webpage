<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Box Breathing</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;600&display=swap');

    :root {
      --bg: #060b12;
      --bg-deep: #04070c;
      --accent: #00e5ff;
      --accent-soft: rgba(0, 229, 255, 0.25);
      --text: #e6fbff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(600px 600px at 70% 20%, rgba(0, 229, 255, 0.12), transparent 60%),
        radial-gradient(500px 500px at 20% 80%, rgba(0, 130, 255, 0.12), transparent 65%),
        linear-gradient(180deg, var(--bg-deep), var(--bg));
      color: var(--text);
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
    }

    .stage {
      position: relative;
      width: min(76vw, 360px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    line {
      stroke: var(--accent);
      stroke-width: 6;
      stroke-linecap: round;
      filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.5));
    }

    .center-text {
      position: absolute;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .phase {
      font-size: clamp(20px, 3.4vw, 30px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .countdown {
      font-family: "IBM Plex Mono", "Menlo", monospace;
      font-size: clamp(36px, 6.5vw, 56px);
      color: var(--accent);
    }

    @media (max-width: 480px) {
      line {
        stroke-width: 5;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 240 240" aria-hidden="true">
      <line id="side-bottom" x1="30" y1="210" x2="210" y2="210"></line>
      <line id="side-right" x1="210" y1="210" x2="210" y2="30"></line>
      <line id="side-top" x1="210" y1="30" x2="30" y2="30"></line>
      <line id="side-left" x1="30" y1="30" x2="30" y2="210"></line>
    </svg>
    <div class="center-text" aria-live="polite">
      <div class="phase" id="phase">Inhale</div>
      <div class="countdown" id="countdown">4</div>
    </div>
  </div>

  <script>
    const phaseDuration = 4;
    const phases = [
      { name: "Inhale", side: "bottom" },
      { name: "Hold", side: "right" },
      { name: "Exhale", side: "top" },
      { name: "Hold", side: "left" }
    ];
    const sides = ["bottom", "right", "top", "left"];

    const totalCycles = 6;
    const cycleDuration = phaseDuration * phases.length;
    const totalDuration = cycleDuration * totalCycles;

    const phaseEl = document.getElementById("phase");
    const countdownEl = document.getElementById("countdown");

    const lines = {};
    sides.forEach((side) => {
      const line = document.getElementById(`side-${side}`);
      const length = line.getTotalLength();
      line.style.strokeDasharray = length;
      line.style.strokeDashoffset = length;
      lines[side] = { el: line, length };
    });

    const setProgress = (side, progress) => {
      const { el, length } = lines[side];
      const offset = length * (1 - progress);
      el.style.strokeDashoffset = offset;
    };

    let startTime = null;

    const animate = (timestamp) => {
      if (!startTime) startTime = timestamp;
      const elapsed = (timestamp - startTime) / 1000;

      if (elapsed >= totalDuration) {
        sides.forEach((side) => setProgress(side, 1));
        phaseEl.textContent = "Complete";
        countdownEl.textContent = "";
        return;
      }

      const cycleTime = elapsed % cycleDuration;
      const phaseIndex = Math.floor(cycleTime / phaseDuration);
      const phaseTime = cycleTime % phaseDuration;
      const phase = phases[phaseIndex];

      phaseEl.textContent = phase.name;
      countdownEl.textContent = Math.ceil(phaseDuration - phaseTime).toString();

      sides.forEach((side, index) => {
        let progress = 0;
        if (index < phaseIndex) {
          progress = 1;
        } else if (index === phaseIndex) {
          progress = phaseTime / phaseDuration;
        }
        setProgress(side, progress);
      });

      requestAnimationFrame(animate);
    };

    requestAnimationFrame(animate);
  </script>
</body>
</html>
