<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidewalks of Rage</title>
    <style>
      :root {
        --control-column-width: 0px;
        --control-gap: clamp(10px, 2.5vw, 20px);
        --control-padding: 16px;
        --dpad-size: clamp(84px, 18vw, 170px);
        --attack-size: clamp(70px, 16vw, 150px);
        --jump-size: clamp(64px, 15vw, 140px);
        --action-gap: clamp(10px, 2.5vw, 18px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #0b0b0b;
        overflow: hidden;
      }

      body.touch-enabled {
        --control-column-width: clamp(80px, 18vw, 200px);
      }

      #app {
        height: 100vh;
        width: 100vw;
        position: relative;
      }

      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game-container canvas {
        display: block;
      }

      .touch-controls {
        position: fixed;
        top: 0;
        bottom: 0;
        width: var(--control-column-width);
        display: none;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0 var(--control-padding) var(--control-padding);
        pointer-events: auto;
      }

      body.touch-enabled .touch-controls {
        display: flex;
      }

      #left-controls {
        left: 0;
        align-items: flex-end;
      }

      #right-controls {
        right: 0;
        align-items: flex-start;
      }

      .virtual-dpad {
        position: relative;
        width: var(--dpad-size);
        height: var(--dpad-size);
        border-radius: 16px;
        background: #141414;
        border: 3px solid #f2c94c;
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.08s ease;
      }

      .virtual-dpad::before,
      .virtual-dpad::after {
        content: '';
        position: absolute;
        background: #2a2a2a;
        border: 2px solid #4dd6a6;
      }

      .virtual-dpad::before {
        width: 36%;
        height: 100%;
        left: 32%;
        top: 0;
      }

      .virtual-dpad::after {
        width: 100%;
        height: 36%;
        left: 0;
        top: 32%;
      }

      .virtual-dpad-center {
        position: absolute;
        width: 22%;
        height: 22%;
        left: 39%;
        top: 39%;
        background: #101010;
        border: 2px solid #f2c94c;
      }

      .virtual-dpad.is-pressed {
        transform: scale(0.97);
      }

      .virtual-buttons {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--action-gap);
      }

      .virtual-button {
        border-radius: 999px;
        background: #1a1a1a;
        color: #f8f8f8;
        border: 3px solid var(--button-border);
        font: 700 13px/1 Verdana, sans-serif;
        letter-spacing: 1px;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.08s ease;
      }

      .virtual-button.attack {
        width: var(--attack-size);
        height: var(--attack-size);
        --button-border: #f25f5c;
        box-shadow: 0 0 0 4px rgba(242, 95, 92, 0.15);
      }

      .virtual-button.jump {
        width: var(--jump-size);
        height: var(--jump-size);
        --button-border: #4dd6a6;
        box-shadow: 0 0 0 4px rgba(77, 214, 166, 0.15);
      }

      .virtual-button.is-pressed {
        transform: scale(0.94);
      }
    </style>
    <script type="module" crossorigin src="/sidewalks-of-rage/assets/index-DchoBFHc.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="left-controls" class="touch-controls" aria-hidden="true">
        <div id="dpad" class="virtual-dpad">
          <div class="virtual-dpad-center"></div>
        </div>
      </div>
      <div id="game-container"></div>
      <div id="right-controls" class="touch-controls">
        <div class="virtual-buttons">
          <button id="jump-button" class="virtual-button jump" type="button">Jump</button>
          <button id="attack-button" class="virtual-button attack" type="button">Attack</button>
        </div>
      </div>
    </div>
  </body>
</html>
